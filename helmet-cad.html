  // ======================= VECTORS =======================
  vector: def({
    name: 'Vector (v / a)', category: 'Vectors', pts: [['x', 'y']],
    defaults: (at) => ({ x: at.x, y: at.y, angle: 0, length: 1.2, label: 'v', color: VEC_COLOR }),
    params: [
      { key: 'angle', label: 'Direction°', type: 'number', step: 5 },
      { key: 'length', label: 'Length', type: 'number', min: 0.1, step: 0.1 },
      { key: 'label', label: 'Label', type: 'text' },
      { key: 'color', label: 'Color', type: 'color' },
    ],
    handles: (e) => [
      { key: 'p0', x: e.x, y: e.y },
      { key: 'tip', x: e.x + Math.cos(rad(e.angle)) * e.length, y: e.y + Math.sin(rad(e.angle)) * e.length },
    ],
    applyHandle: (e, key, w) => {
      if (key === 'p0') { e.x = w.x; e.y = w.y; }
      else { const d = V.sub(w, P(e, 'x', 'y')); e.length = Math.max(0.1, V.len(d)); e.angle = deg(V.angle(d)); }
    },
    bounds: (e) => boundsOf([P(e, 'x', 'y'), { x: e.x + Math.cos(rad(e.angle)) * e.length, y: e.y + Math.sin(rad(e.angle)) * e.length }], 0.3),
    draw: (e, pen) => {
      const tail = P(e, 'x', 'y'); const tip = V.add(tail, V.fromAngle(rad(e.angle), e.length));
      pen.line(tail, tip, { stroke: e.color, w: 2.2 });
      pen.arrow(tip, rad(e.angle), { sizePx: 11, fill: e.color });
      if (e.label) pen.text(V.add(tip, V.fromAngle(rad(e.angle), 0.22)), e.label, { sizePx: 15, color: e.color, italic: true, weight: 'bold', bg: '#ffffffcc' });
    },
  }),

  omega: def({
    name: 'Angular velocity ω', category: 'Vectors', pts: [['x', 'y']],
    defaults: (at) => ({ x: at.x, y: at.y, r: 0.45, dir: 1, start: 120, sweep: 220, label: 'ω', color: INK }),
    params: [
      { key: 'r', label: 'Radius', type: 'number', min: 0.1, step: 0.05 },
      { key: 'dir', label: 'Direction', type: 'select', options: [{ v: 1, t: 'CCW ↺' }, { v: -1, t: 'CW ↻' }] },
      { key: 'start', label: 'Start°', type: 'number', step: 5 },
      { key: 'sweep', label: 'Sweep°', type: 'number', min: 10, max: 350, step: 5 },
      { key: 'label', label: 'Label', type: 'text' },
      { key: 'color', label: 'Color', type: 'color' },
    ],
    bounds: (e) => boundsOf([P(e, 'x', 'y')], e.r + 0.3),
    draw: (e, pen) => {
      arcArrow(pen, P(e, 'x', 'y'), e.r, e.start, e.sweep, Number(e.dir), e.color, 2);
      if (e.label) pen.text(V.add(P(e, 'x', 'y'), { x: 0, y: 0 }), e.label, { sizePx: 16, color: e.color, italic: true });
    },
  }),

  axes: def({
    name: 'Coordinate axes', category: 'Vectors', pts: [['x', 'y']],
    defaults: (at) => ({ x: at.x, y: at.y, length: 1.6, labelX: 'x', labelY: 'y' }),
    params: [
      { key: 'length', label: 'Length', type: 'number', min: 0.3, step: 0.1 },
      { key: 'labelX', label: 'X label', type: 'text' },
      { key: 'labelY', label: 'Y label', type: 'text' },
    ],
    bounds: (e) => boundsOf([P(e, 'x', 'y'), { x: e.x + e.length, y: e.y + e.length }], 0.3),
    draw: (e, pen) => {
      const o = P(e, 'x', 'y');
      const xt = V.add(o, { x: e.length, y: 0 }), yt = V.add(o, { x: 0, y: e.length });
      pen.line(o, xt, { w: 1.6 }); pen.arrow(xt, 0, { sizePx: 10 });
      pen.line(o, yt, { w: 1.6 }); pen.arrow(yt, Math.PI / 2, { sizePx: 10 });
      pen.text(V.add(xt, { x: 0.2, y: 0 }), e.labelX, { sizePx: 15, italic: true });
      pen.text(V.add(yt, { x: 0, y: 0.22 }), e.labelY, { sizePx: 15, italic: true });
    },
  }),

  // ======================= DIMENSIONS =======================
  dimLinear: def({
    name: 'Linear dimension', category: 'Dimensions', snap: false, pts: [['x1', 'y1'], ['x2', 'y2']],
    defaults: (at) => ({ x1: at.x, y1: at.y, x2: at.x + 2, y2: at.y, offset: 0.8, text: '', unit: '', decimals: 2 }),
    params: [
      { key: 'offset', label: 'Offset', type: 'number', step: 0.1 },
      { key: 'unit', label: 'Unit', type: 'text' },
      { key: 'decimals', label: 'Decimals', type: 'number', min: 0, max: 4, step: 1 },
      { key: 'text', label: 'Override text', type: 'text' },
    ],
    handles: (e) => {
      const a = P(e, 'x1', 'y1'), b = P(e, 'x2', 'y2');
      const n = V.scale(V.perp(V.norm(V.sub(b, a))), e.offset);
      const m = V.add(V.mid(a, b), n);
      return [{ key: 'p0', x: a.x, y: a.y }, { key: 'p1', x: b.x, y: b.y }, { key: 'off', x: m.x, y: m.y }];
    },
    applyHandle: (e, key, w) => {
      if (key === 'p0') setP(e, 'x1', 'y1', w);
      else if (key === 'p1') setP(e, 'x2', 'y2', w);
      else {
        const a = P(e, 'x1', 'y1'), b = P(e, 'x2', 'y2');
        const n = V.perp(V.norm(V.sub(b, a)));
        e.offset = V.dot(V.sub(w, V.mid(a, b)), n);
      }
    },
    bounds: (e) => {
      const a = P(e, 'x1', 'y1'), b = P(e, 'x2', 'y2');
      const n = V.scale(V.perp(V.norm(V.sub(b, a))), e.offset);
      return boundsOf([a, b, V.add(a, n), V.add(b, n)], 0.3);
    },
    draw: (e, pen) => {
      const a = P(e, 'x1', 'y1'), b = P(e, 'x2', 'y2');
      const u = V.norm(V.sub(b, a)); const n = V.perp(u);
      const off = V.scale(n, e.offset);
      const da = V.add(a, off), db = V.add(b, off);
      const ext = V.scale(n, Math.sign(e.offset || 1) * 0.12);
      // extension lines
      pen.line(V.add(a, V.scale(n, e.offset * 0.06)), V.add(da, ext), { stroke: DIM_COLOR, w: 1 });
      pen.line(V.add(b, V.scale(n, e.offset * 0.06)), V.add(db, ext), { stroke: DIM_COLOR, w: 1 });
      // dimension line + arrows pointing outward to the witness points
      pen.line(da, db, { stroke: DIM_COLOR, w: 1.2 });
      pen.arrow(da, V.angle(V.scale(u, -1)), { sizePx: 9, fill: DIM_COLOR });
      pen.arrow(db, V.angle(u), { sizePx: 9, fill: DIM_COLOR });
      const txt = e.text || (fmt(V.dist(a, b), e.decimals) + (e.unit ? ' ' + e.unit : ''));
      let ang = V.angle(u); if (ang > Math.PI / 2 || ang < -Math.PI / 2) ang += Math.PI; // keep upright
      pen.text(V.add(V.mid(da, db), V.scale(n, 0.18)), txt, { sizePx: 14, color: DIM_COLOR, rotate: -ang, bg: '#ffffffd9' });
    },
  }),

  dimAngular: def({
    name: 'Angular dimension', category: 'Dimensions', snap: false, pts: [['vx', 'vy'], ['x1', 'y1'], ['x2', 'y2']],
    defaults: (at) => ({ vx: at.x, vy: at.y, x1: at.x + 1.5, y1: at.y, x2: at.x + 1, y2: at.y + 1.1, radius: 0.9, text: '', decimals: 1 }),
    params: [
      { key: 'radius', label: 'Arc radius', type: 'number', min: 0.1, step: 0.1 },
      { key: 'decimals', label: 'Decimals', type: 'number', min: 0, max: 3, step: 1 },
      { key: 'text', label: 'Override text', type: 'text' },
    ],
    handles: (e) => {
      const v = P(e, 'vx', 'vy');
      const am = (V.angle(V.sub(P(e, 'x1', 'y1'), v)) + V.angle(V.sub(P(e, 'x2', 'y2'), v))) / 2;
      const mid = V.add(v, V.fromAngle(am, e.radius));
      return [{ key: 'p0', x: e.vx, y: e.vy }, { key: 'p1', x: e.x1, y: e.y1 }, { key: 'p2', x: e.x2, y: e.y2 }, { key: 'rad', x: mid.x, y: mid.y }];
    },
    applyHandle: (e, key, w) => {
      if (key === 'p0') setP(e, 'vx', 'vy', w);
      else if (key === 'p1') setP(e, 'x1', 'y1', w);
      else if (key === 'p2') setP(e, 'x2', 'y2', w);
      else e.radius = Math.max(0.1, V.dist(P(e, 'vx', 'vy'), w));
    },
    bounds: (e) => boundsOf([P(e, 'vx', 'vy'), P(e, 'x1', 'y1'), P(e, 'x2', 'y2')], e.radius),
    draw: (e, pen) => {
      const v = P(e, 'vx', 'vy');
      let a1 = V.angle(V.sub(P(e, 'x1', 'y1'), v));
      let a2 = V.angle(V.sub(P(e, 'x2', 'y2'), v));
      let dA = normAngle(a2 - a1);            // signed shortest sweep
      const r = e.radius;
      // extension lines along the two arms
      pen.line(v, V.add(v, V.fromAngle(a1, r + 0.18)), { stroke: DIM_COLOR, w: 1 });
      pen.line(v, V.add(v, V.fromAngle(a2, r + 0.18)), { stroke: DIM_COLOR, w: 1 });
      pen.arc(v, r, a1, a1 + dA, { stroke: DIM_COLOR, w: 1.2 });
      pen.arrow(V.add(v, V.fromAngle(a1, r)), a1 + (dA > 0 ? Math.PI / 2 : -Math.PI / 2), { sizePx: 8, fill: DIM_COLOR });
      pen.arrow(V.add(v, V.fromAngle(a1 + dA, r)), a1 + dA + (dA > 0 ? -Math.PI / 2 : Math.PI / 2), { sizePx: 8, fill: DIM_COLOR });
      const txt = e.text || (fmt(Math.abs(deg(dA)), e.decimals) + '°');
      pen.text(V.add(v, V.fromAngle(a1 + dA / 2, r + 0.28)), txt, { sizePx: 14, color: DIM_COLOR, bg: '#ffffffd9' });
    },
  }),

  dimRadius: def({
    name: 'Radius / diameter', category: 'Dimensions', snap: false, pts: [['cx', 'cy']],
    defaults: (at) => ({ cx: at.x, cy: at.y, r: 0.6, angle: 45, prefix: 'R', text: '', decimals: 2 }),
    params: [
      { key: 'r', label: 'Radius', type: 'number', min: 0.01, step: 0.05 },
      { key: 'angle', label: 'Leader°', type: 'number', step: 5 },
      { key: 'prefix', label: 'Prefix', type: 'select', options: [{ v: 'R', t: 'Radius R' }, { v: '⌀', t: 'Diameter ⌀' }] },
      { key: 'decimals', label: 'Decimals', type: 'number', min: 0, max: 3, step: 1 },
      { key: 'text', label: 'Override text', type: 'text' },
    ],
    handles: (e) => {
      const tip = V.add(P(e, 'cx', 'cy'), V.fromAngle(rad(e.angle), e.r));
      return [{ key: 'p0', x: e.cx, y: e.cy }, { key: 'tip', x: tip.x, y: tip.y }];
    },
    applyHandle: (e, key, w) => {
      if (key === 'p0') setP(e, 'cx', 'cy', w);
      else { const d = V.sub(w, P(e, 'cx', 'cy')); e.r = Math.max(0.01, V.len(d)); e.angle = deg(V.angle(d)); }
    },
    bounds: (e) => boundsOf([P(e, 'cx', 'cy')], e.r + 0.4),
    draw: (e, pen) => {
      const c = P(e, 'cx', 'cy'); const tip = V.add(c, V.fromAngle(rad(e.angle), e.r));
      const out = V.add(c, V.fromAngle(rad(e.angle), e.r + 0.4));
      pen.line(c, out, { stroke: DIM_COLOR, w: 1.1 });
      pen.arrow(tip, rad(e.angle), { sizePx: 9, fill: DIM_COLOR });
      const val = e.prefix === '⌀' ? e.r * 2 : e.r;
      const txt = e.text || (e.prefix + fmt(val, e.decimals));
      pen.text(V.add(out, { x: 0.1, y: 0 }), txt, { sizePx: 14, color: DIM_COLOR, anchor: 'start', bg: '#ffffffd9' });
    },
  }),

  dimCoord: def({
    name: 'Coordinate', category: 'Dimensions', snap: false, pts: [['x', 'y']],
    defaults: (at) => ({ x: at.x, y: at.y, lead: 0.8, decimals: 2 }),
    params: [
      { key: 'lead', label: 'Leader', type: 'number', step: 0.1 },
      { key: 'decimals', label: 'Decimals', type: 'number', min: 0, max: 4, step: 1 },
    ],
    bounds: (e) => boundsOf([P(e, 'x', 'y')], Math.abs(e.lead) + 0.6),
    draw: (e, pen) => {
      const c = P(e, 'x', 'y');
      const t = V.add(c, { x: e.lead, y: e.lead });
      pen.line(c, t, { stroke: DIM_COLOR, w: 1 });
      pen.circlePx(c, 2.5, { fill: DIM_COLOR, stroke: DIM_COLOR });
      pen.text(V.add(t, { x: 0.08, y: 0 }), `(${fmt(e.x, e.decimals)}, ${fmt(e.y, e.decimals)})`, { sizePx: 13, color: DIM_COLOR, anchor: 'start', bg: '#ffffffd9' });
    },
  }),

  // ======================= ANNOTATION =======================
  label: def({
    name: 'Text label', category: 'Annotation', snap: false, pts: [['x', 'y']],
    defaults: (at) => ({ x: at.x, y: at.y, text: 'Text', size: 16, angle: 0, italic: false }),
    params: [
      { key: 'text', label: 'Text', type: 'text' },
      { key: 'size', label: 'Size (px)', type: 'number', min: 6, max: 72, step: 1 },
      { key: 'angle', label: 'Angle°', type: 'number', step: 5 },
      { key: 'italic', label: 'Italic', type: 'bool' },
    ],
    draw: (e, pen) => pen.text(P(e, 'x', 'y'), e.text, { sizePx: e.size, rotate: -rad(e.angle), italic: e.italic, anchor: 'start' }),
  }),
};

// Shared drawing for pin/roller triangular supports.
// No ground line/hatch — pair with a Fixed wall prefab when you want ground.
function drawTriSupport(e, pen, roller) {
  const apex = P(e, 'x', 'y');
  const down = V.fromAngle(rad(e.angle));
  const baseC = V.add(apex, V.scale(down, e.size));
  const bdir = V.perp(down);
  const bh = e.size * 0.62;
  const p1 = V.add(baseC, V.scale(bdir, bh)), p2 = V.add(baseC, V.scale(bdir, -bh));
  pen.poly([apex, p1, p2], { close: true, w: 1.7, fill: '#fff' });
  pen.circlePx(apex, 5, { stroke: INK, w: 1.6, fill: '#fff' });
  if (roller) {
    const rr = e.size * 0.16;
    const off = V.scale(down, rr);
    pen.circlePx(V.add(V.add(baseC, V.scale(bdir, bh * 0.5)), off), rr * pen.scale, { stroke: INK, w: 1.4, fill: '#fff' });
    pen.circlePx(V.add(V.add(baseC, V.scale(bdir, -bh * 0.5)), off), rr * pen.scale, { stroke: INK, w: 1.4, fill: '#fff' });
  }
}

// Factory: create a fresh entity of `type` placed at world point `at`.
function createEntity(type, at) {
  const d = DEFS[type];
  if (!d) throw new Error('Unknown entity type: ' + type);
  return { id: uid(), type, ...d.defaults(at) };
}


// ===== prefabs.js =====
// The spawnable prefab catalog, grouped by category for the palette.
// Derived from the entity definitions so the two never drift apart.

const CATEGORY_ORDER = ['Structure', 'Supports', 'Loads', 'Vectors', 'Dimensions', 'Annotation'];

function prefabGroups() {
  const groups = new Map(CATEGORY_ORDER.map((c) => [c, []]));
  for (const [type, d] of Object.entries(DEFS)) {
    if (!groups.has(d.category)) groups.set(d.category, []);
    groups.get(d.category).push({ type, name: d.name });
  }
  return [...groups.entries()].filter(([, items]) => items.length).map(([category, items]) => ({ category, items }));
}


// ===== store.js =====
// Document model: the list of entities, the current selection, undo/redo
// history, and (de)serialization. Emits 'change' so views can re-render.

class Store {
  constructor() {
    this.entities = [];
    this.selection = new Set();
    this.sheet = null;           // Blueprint sheet config (lazily created)
    this.filePath = null;
    this.dirty = false;
    this._undo = [];
    this._redo = [];
    this._subs = new Set();
    this._snapshot = this._cap(); // baseline
  }

  // ---- pub/sub ----
  subscribe(fn) { this._subs.add(fn); return () => this._subs.delete(fn); }
  emit() { for (const fn of this._subs) fn(this); }

  // ---- history ----
  _cap() { return JSON.stringify(this.entities); }
  commit() {
    this._undo.push(this._snapshot);
    if (this._undo.length > 200) this._undo.shift();
    this._redo.length = 0;
    this._snapshot = this._cap();
    this.dirty = true;
    this.emit();
  }
  undo() {
    if (!this._undo.length) return;
    this._redo.push(this._cap());
    const s = this._undo.pop();
    this.entities = JSON.parse(s);
    this._snapshot = s;
    this._pruneSelection();
    this.dirty = true;
    this.emit();
  }
  redo() {
    if (!this._redo.length) return;
    this._undo.push(this._cap());
    const s = this._redo.pop();
    this.entities = JSON.parse(s);
    this._snapshot = s;
    this._pruneSelection();
    this.dirty = true;
    this.emit();
  }

  // ---- entity ops ----
  add(entity, { select = true, commit = true } = {}) {
    this.entities.push(entity);
    if (select) { this.selection.clear(); this.selection.add(entity.id); }
    if (commit) this.commit(); else this.emit();
    return entity;
  }
  remove(ids) {
    const set = new Set(ids);
    this.entities = this.entities.filter((e) => !set.has(e.id));
    for (const id of ids) this.selection.delete(id);
    this.commit();
  }
  get(id) { return this.entities.find((e) => e.id === id); }
  byZ() { return this.entities; } // draw order = insertion order
  _pruneSelection() {
    const live = new Set(this.entities.map((e) => e.id));
    for (const id of [...this.selection]) if (!live.has(id)) this.selection.delete(id);
  }

  // ---- selection ----
  selectOnly(id) { this.selection.clear(); if (id) this.selection.add(id); this.emit(); }
  toggle(id) { this.selection.has(id) ? this.selection.delete(id) : this.selection.add(id); this.emit(); }
  selectAll() { this.selection = new Set(this.entities.map((e) => e.id)); this.emit(); }
  clearSelection() { this.selection.clear(); this.emit(); }
  selected() { return this.entities.filter((e) => this.selection.has(e.id)); }

  // ---- file ----
  serialize() {
    return JSON.stringify({ app: 'helmet-cad', version: 1, entities: this.entities, sheet: this.sheet }, null, 2);
  }
  loadData(json) {
    const data = typeof json === 'string' ? JSON.parse(json) : json;
    if (!data || !Array.isArray(data.entities)) throw new Error('Not a Helmet CAD file');
    // keep only entities whose type we understand
    this.entities = data.entities.filter((e) => DEFS[e.type]);
    this.sheet = data.sheet || null;
    this.selection.clear();
    this._undo.length = 0; this._redo.length = 0;
    this._snapshot = this._cap();
    this.dirty = false;
    this.emit();
  }
  newDocument() {
    this.entities = []; this.selection.clear(); this.sheet = null; this.filePath = null;
    this._undo.length = 0; this._redo.length = 0; this._snapshot = this._cap();
    this.dirty = false; this.emit();
  }
}


// ===== tools.js =====
// Pointer interaction + tool state machine: Select (pick / move / edit handles /
// marquee), Place (spawn prefabs with 1–3 clicks), and panning / zooming.
// Snapping gives the CAD feel: cursor locks onto joints, endpoints and the grid.

// How many clicks each prefab needs, and which handle each click drives.
const PLACE_STEPS = {
  node: ['p0'], link: ['p0', 'p1'], fixedWall: ['p0', 'p1'],
  pinSupport: ['p0'], rollerSupport: ['p0'], sliderSlot: ['p0'], piston: ['p0'],
  force: ['p0', 'tail'], distributed: ['p0', 'p1'], moment: ['p0'],
  vector: ['p0', 'tip'], omega: ['p0'], axes: ['p0'],
  dimLinear: ['p0', 'p1'], dimAngular: ['p0', 'p1', 'p2'],
  dimRadius: ['p0'], dimCoord: ['p0'], label: ['p0'],
};

class Tools {
  constructor(app) {
    this.app = app;            // { store, cam, svg, render(), setTool(), overlay }
    this.tool = 'select';      // 'select' | 'place'
    this.placeType = null;
    this.snapEnabled = true;
    this.gridSnap = 0.25;
    this.drag = null;          // active gesture
    this.placing = null;       // in-progress placement
  }

  setTool(tool, placeType = null) {
    this._cancelPlacing();
    this.tool = tool;
    this.placeType = placeType;
    this.ghost = null;
    this.app.overlay.ghost = null;
    this.app.overlay.mateTarget = null;
    this.app.overlay.cursor = tool === 'place' ? 'crosshair' : 'default';
    this.app.render();
  }

  // ---- snapping ---------------------------------------------------------------
  snap(world, excludeIds = new Set()) {
    let best = null, bestD = 10 / this.app.cam.scale;
    if (this.snapEnabled) {
      for (const e of this.app.store.entities) {
        const d = DEFS[e.type];
        if (!d.snap || excludeIds.has(e.id)) continue;
        for (const a of d.anchors(e)) {
          const dist = V.dist(world, a);
          if (dist < bestD) { bestD = dist; best = a; }
        }
      }
    }
    if (best) return { point: { x: best.x, y: best.y }, snapped: true, kind: 'point' };
    if (this.snapEnabled && this.gridSnap > 0) {
      const g = this.gridSnap;
      return { point: { x: Math.round(world.x / g) * g, y: Math.round(world.y / g) * g }, snapped: true, kind: 'grid' };
    }
    return { point: world, snapped: false };
  }

  // ---- picking ----------------------------------------------------------------
  // Skeleton used for hit-testing: handle points + segments between them.
  _skeleton(e) {
    const hs = DEFS[e.type].handles(e);
    const pts = hs.map((h) => ({ x: h.x, y: h.y }));
    const segs = [];
    for (let i = 0; i + 1 < pts.length; i++) segs.push([pts[i], pts[i + 1]]);
    return { pts, segs };
  }

  pickHandle(world) {
    const tol = 9 / this.app.cam.scale;
    for (const e of this.app.store.selected().reverse()) {
      for (const h of DEFS[e.type].handles(e)) {
        if (V.dist(world, h) <= tol) return { entity: e, handle: h.key };
      }
    }
    return null;
  }

  pickEntity(world) {
    const tol = 6 / this.app.cam.scale;
    const ents = this.app.store.entities;
    // pass 1: near the skeleton (lines/points)
    for (let i = ents.length - 1; i >= 0; i--) {
      const e = ents[i]; const sk = this._skeleton(e);
      let d = Infinity;
      for (const p of sk.pts) d = Math.min(d, V.dist(world, p));
      for (const [a, b] of sk.segs) {
        const ab = V.sub(b, a); const t = Math.max(0, Math.min(1, V.dot(V.sub(world, a), ab) / (V.dot(ab, ab) || 1)));
        d = Math.min(d, V.dist(world, V.add(a, V.scale(ab, t))));
      }
      if (d <= tol) return e;
    }
    // pass 2: inside the bounding box (area-like prefabs: blocks, supports, text)
    for (let i = ents.length - 1; i >= 0; i--) {
      const e = ents[i]; const b = DEFS[e.type].bounds(e);
      if (world.x >= b.minX && world.x <= b.maxX && world.y >= b.minY && world.y <= b.maxY) return e;
    }
    return null;
  }

  // ---- event helpers ----------------------------------------------------------
  _evtWorld(ev) {
    const r = this.app.svg.getBoundingClientRect();
    return this.app.cam.toWorld({ x: ev.clientX - r.left, y: ev.clientY - r.top });
  }
  _evtScreen(ev) {
    const r = this.app.svg.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }

  // ---- pointer handlers -------------------------------------------------------
  onWheel(ev) {
    ev.preventDefault();
    const s = this._evtScreen(ev);
    this.app.cam.zoomAt(s, ev.deltaY < 0 ? 1.12 : 1 / 1.12);
    this.app.render();
  }

  onPointerDown(ev) {
    if (ev.button === 1 || ev.button === 2 || ev.spaceKey) { // middle/right/space = pan
      this.drag = { type: 'pan', last: this._evtScreen(ev) };
      this.app.svg.setPointerCapture(ev.pointerId);
      return;
    }
    const world = this._evtWorld(ev);

    if (this.tool === 'place') { this._placeClick(world); return; }

    // SELECT tool
    const h = this.pickHandle(world);
    if (h) {
      this.drag = { type: 'handle', entity: h.entity, handle: h.handle, moved: false };
      this.app.svg.setPointerCapture(ev.pointerId);
      return;
    }
    const hit = this.pickEntity(world);
    if (hit) {
      if (ev.shiftKey) this.app.store.toggle(hit.id);
      else if (!this.app.store.selection.has(hit.id)) this.app.store.selectOnly(hit.id);
      const snap = this.snap(world, this.app.store.selection);
      this.drag = { type: 'move', last: snap.point, moved: false };
      this.app.svg.setPointerCapture(ev.pointerId);
    } else {
      if (!ev.shiftKey) this.app.store.clearSelection();
      this.drag = { type: 'marquee', start: world, cur: world };
      this.app.svg.setPointerCapture(ev.pointerId);
    }
    this.app.render();
  }

  onPointerMove(ev) {
    const world = this._evtWorld(ev);
    // live snap indicator
    const snap = this.snap(world, this.drag && this.drag.type === 'handle' ? new Set([this.drag.entity.id]) : (this.drag && this.drag.type === 'move' ? this.app.store.selection : new Set()));
    this.app.overlay.snap = snap.snapped ? snap.point : null;

    if (this.placing) { this._placeHover(snap.point); this.app.render(); return; }

    // Ghost preview of the prefab about to be placed (with live link-snapping).
    if (this.tool === 'place' && !this.drag) { this._updateGhost(snap.point); this.app.render(); return; }

    if (!this.drag) { this.app.render(); return; }

    if (this.drag.type === 'pan') {
      const s = this._evtScreen(ev);
      this.app.cam.panBy(s.x - this.drag.last.x, s.y - this.drag.last.y);
      this.drag.last = s; this.app.render(); return;
    }
    if (this.drag.type === 'handle') {
      DEFS[this.drag.entity.type].applyHandle(this.drag.entity, this.drag.handle, snap.point);
      this.drag.moved = true; this.app.store.emit(); this.app.render(); return;
    }
    if (this.drag.type === 'move') {
      const d = V.sub(snap.point, this.drag.last);
      if (d.x || d.y) {
        for (const e of this.app.store.selected()) DEFS[e.type].translate(e, d);
        this.drag.last = snap.point; this.drag.moved = true; this.app.store.emit();
      }
      this.app.render(); return;
    }
    if (this.drag.type === 'marquee') {
      this.drag.cur = world; this.app.overlay.marquee = { a: this.drag.start, b: world }; this.app.render(); return;
    }
  }

  onPointerUp(ev) {
    if (!this.drag) return;
    const d = this.drag; this.drag = null;
    try { this.app.svg.releasePointerCapture(ev.pointerId); } catch (_) {}
    if (d.type === 'marquee') {
      this.app.overlay.marquee = null;
      const r = { minX: Math.min(d.start.x, d.cur.x), maxX: Math.max(d.start.x, d.cur.x), minY: Math.min(d.start.y, d.cur.y), maxY: Math.max(d.start.y, d.cur.y) };
      if (Math.abs(d.start.x - d.cur.x) > 0.02 || Math.abs(d.start.y - d.cur.y) > 0.02) {
        for (const e of this.app.store.entities) {
          const b = DEFS[e.type].bounds(e);
          if (b.minX >= r.minX && b.maxX <= r.maxX && b.minY >= r.minY && b.maxY <= r.maxY) this.app.store.selection.add(e.id);
        }
        this.app.store.emit();
      }
    } else if ((d.type === 'move' || d.type === 'handle') && d.moved) {
      this.app.store.commit();
    }
    this.app.render();
  }

  // ---- placement --------------------------------------------------------------
  _placeClick(world) {
    const snap = this.snap(world, this.placing ? new Set([this.placing.entity.id]) : new Set());
    const w = snap.point;
    this.ghost = null; this.app.overlay.ghost = null; this.app.overlay.mateTarget = null;
    if (!this.placing) {
      const e = createEntity(this.placeType, w);
      this.app.store.add(e, { select: true, commit: false });
      const steps = PLACE_STEPS[this.placeType] || ['p0'];
      DEFS[e.type].applyHandle(e, steps[0], w);
      this.placing = { entity: e, steps, idx: 1 };
      if (steps.length === 1) this._finishPlacing();
    } else {
      const { entity, steps, idx } = this.placing;
      DEFS[entity.type].applyHandle(entity, steps[idx], w);
      this.placing.idx++;
      if (this.placing.idx >= steps.length) this._finishPlacing();
    }
    this.app.store.emit(); this.app.render();
  }

  _placeHover(w) {
    if (!this.placing) return;
    const { entity, steps, idx } = this.placing;
    if (idx < steps.length) DEFS[entity.type].applyHandle(entity, steps[idx], w);
  }

  _finishPlacing() {
    if (!this.placing) return;
    this._mateToLink(this.placing.entity, true);
    this.app.store.selectOnly(this.placing.entity.id);
    this.placing = null;
    this.app.store.commit(); // entity already in store; commit records it
  }

  // Live preview of the prefab under the cursor before the first click.
  _updateGhost(w) {
    const g = createEntity(this.placeType, w);
    const link = this._mateToLink(g, true, true); // mate, exclude nothing (ghost not in store)
    this.ghost = g;
    this.app.overlay.ghost = g;
    this.app.overlay.mateTarget = link;
  }

  // Mate a slider/support to the nearest link: orient to it and (optionally) snap
  // its position onto the bar. Returns the link it mated to, or null. The mate is
  // only a starting point — every value stays editable in Properties afterward.
  _mateToLink(e, snapPos = false) {
    if (!['sliderSlot', 'rollerSupport', 'pinSupport'].includes(e.type)) return null;
    const p = { x: e.x, y: e.y };
    let best = null, bestD = 0.6, proj = null;
    for (const o of this.app.store.entities) {
      if (o.type !== 'link' || o.id === e.id) continue;
      const r = pointSegment(p, { x: o.x1, y: o.y1 }, { x: o.x2, y: o.y2 });
      if (r.dist < bestD) { bestD = r.dist; best = o; proj = r.point; }
    }
    if (!best) return null;
    const ang = deg(V.angle(V.sub({ x: best.x2, y: best.y2 }, { x: best.x1, y: best.y1 })));
    e.angle = e.type === 'sliderSlot' ? ang : ang - 90; // slider slides along; supports stand perpendicular
    if (snapPos && proj) { e.x = proj.x; e.y = proj.y; }
    return best;
  }

  _cancelPlacing() {
    if (this.placing) {
      this.app.store.remove([this.placing.entity.id]);
      this.placing = null;
    }
  }

  onEscape() {
    if (this.placing) { this._cancelPlacing(); this.app.render(); }
    this.setTool('select');
  }
}


// ===== blueprint.js =====
// Blueprint mode: lay the working draft onto a formatted paper sheet (border +
// zone marks + title block), fill in the title block, rearrange/"separate" parts
// for presentation (non-destructively, via per-part offsets), then export/print.
//
// Coordinate systems:
//   world  — the draft's units (as drawn on the canvas)
//   paper  — millimetres on the sheet (Y down)
//   screen — pixels (paper * view.scale, minus pan)
// A part's paper position = origin + (worldPt + partOffset) * scale(mm per unit),
// with Y flipped (world up -> paper down).

const PX_PER_MM = 3.7795; // 96 dpi — used for true-to-size export

const SHEETS = [
  { key: 'A0L', name: 'A0 (ISO) Landscape', w: 1189, h: 841 },
  { key: 'A1L', name: 'A1 (ISO) Landscape', w: 841, h: 594 },
  { key: 'A2L', name: 'A2 (ISO) Landscape', w: 594, h: 420 },
  { key: 'A3L', name: 'A3 (ISO) Landscape', w: 420, h: 297 },
  { key: 'A4L', name: 'A4 (ISO) Landscape', w: 297, h: 210 },
  { key: 'A4P', name: 'A4 (ISO) Portrait', w: 210, h: 297 },
  { key: 'A3P', name: 'A3 (ISO) Portrait', w: 297, h: 420 },
  { key: 'LTRL', name: 'Letter (ANSI A) Landscape', w: 279.4, h: 215.9 },
  { key: 'LTRP', name: 'Letter (ANSI A) Portrait', w: 215.9, h: 279.4 },
];
const sheetByKey = (k) => SHEETS.find((s) => s.key === k) || SHEETS[4];

function defaultSheet() {
  const today = new Date().toISOString().slice(0, 10);
  return {
    sizeKey: 'A4L',
    fields: { title: 'Untitled', name: '', org: '', date: today, dwgNo: '', rev: '', scale: '1:1', sheet: '1 OF 1' },
    layout: { originX: 0, originY: 0, scale: 20, overrides: {} }, // mm, mm, mm/unit, {id:{x,y}}
  };
}

// ------------------------------------------------------------------ rendering
function unionBounds(entities) {
  let b = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
  for (const e of entities) { const eb = DEFS[e.type].bounds(e); b.minX = Math.min(b.minX, eb.minX); b.minY = Math.min(b.minY, eb.minY); b.maxX = Math.max(b.maxX, eb.maxX); b.maxY = Math.max(b.maxY, eb.maxY); }
  if (!isFinite(b.minX)) b = { minX: 0, minY: 0, maxX: 1, maxY: 1 };
  return b;
}

// A camera Pen can use that maps world -> screen through the paper placement.
function drawCam(view, scaleMM, origin, off) {
  return {
    scale: scaleMM * view.scale,
    toScreen(p) {
      const paper = { x: origin.x + (p.x + off.x) * scaleMM, y: origin.y - (p.y + off.y) * scaleMM };
      return view.toScreen(paper);
    },
  };
}

// Build the whole sheet (border, zones, title block, placed drawing) as SVG
// strings. Pure — used for both on-screen render and export. `view` maps paper
// mm -> output px (screen view, or an export view at PX_PER_MM with no pan).
function buildSheetMarkup(view, cfg, entities, clipId = 'bpClip') {
  const out = [];
  const size = sheetByKey(cfg.sizeKey);
  const W = size.w, H = size.h, m = 10;             // outer margin (mm)
  const S = view.scale;                              // px per mm
  const px = (mm) => mm * S;
  const sc = (x, y) => view.toScreen({ x, y });
  const ink = '#14181f';

  const line = (x1, y1, x2, y2, wmm = 0.3, color = ink) => {
    const a = sc(x1, y1), b = sc(x2, y2);
    out.push(`<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="${color}" stroke-width="${px(wmm).toFixed(2)}"/>`);
  };
  const rect = (x, y, w, h, wmm = 0.3, fill = 'none') => {
    const a = sc(x, y);
    out.push(`<rect x="${a.x.toFixed(1)}" y="${a.y.toFixed(1)}" width="${px(w).toFixed(1)}" height="${px(h).toFixed(1)}" fill="${fill}" stroke="${ink}" stroke-width="${px(wmm).toFixed(2)}"/>`);
  };
  const text = (x, y, str, hmm, o = {}) => {
    const a = sc(x, y);
    out.push(`<text x="${a.x.toFixed(1)}" y="${a.y.toFixed(1)}" font-family="${o.font || 'Arial, sans-serif'}" font-size="${px(hmm).toFixed(1)}" fill="${ink}" text-anchor="${o.anchor || 'start'}" dominant-baseline="${o.baseline || 'middle'}" font-weight="${o.weight || 'normal'}">${String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;')}</text>`);
  };

  // paper sheet + drop shadow
  const sh = sc(0, 0);
  out.push(`<rect x="${(sh.x + px(1.2)).toFixed(1)}" y="${(sh.y + px(1.2)).toFixed(1)}" width="${px(W).toFixed(1)}" height="${px(H).toFixed(1)}" fill="#00000022"/>`);
  rect(0, 0, W, H, 0.2, '#ffffff');

  // ---- placed drawing, clipped to the frame ----
  const fx = m, fy = m, fw = W - 2 * m, fh = H - 2 * m;
  const ca = sc(fx, fy);
  out.push(`<clipPath id="${clipId}"><rect x="${ca.x.toFixed(1)}" y="${ca.y.toFixed(1)}" width="${px(fw).toFixed(1)}" height="${px(fh).toFixed(1)}"/></clipPath>`);
  out.push(`<g clip-path="url(#${clipId})">`);
  const origin = { x: cfg.layout.originX, y: cfg.layout.originY };
  for (const e of entities) {
    const off = cfg.layout.overrides[e.id] || { x: 0, y: 0 };
    const cam = drawCam(view, cfg.layout.scale, origin, off);
    const pen = new Pen(cam);
    try { DEFS[e.type].draw(e, pen, { selected: false, scale: cam.scale }); } catch (_) {}
    out.push(pen.out());
  }
  out.push('</g>');

  // ---- frame + zone marks ----
  rect(fx, fy, fw, fh, 0.6);
  const cols = Math.max(4, Math.round(W / 50));
  const rows = Math.max(2, Math.round(H / 55));
  const cw = fw / cols, rh = fh / rows;
  for (let k = 0; k < cols; k++) {
    if (k > 0) { line(fx + k * cw, 0, fx + k * cw, m, 0.3); line(fx + k * cw, H - m, fx + k * cw, H, 0.3); }
    const lbl = String(cols - k);                 // 6..1 left -> right
    text(fx + (k + 0.5) * cw, m / 2, lbl, 3, { anchor: 'middle' });
    text(fx + (k + 0.5) * cw, H - m / 2, lbl, 3, { anchor: 'middle' });
  }
  for (let r = 0; r < rows; r++) {
    if (r > 0) { line(0, fy + r * rh, m, fy + r * rh, 0.3); line(W - m, fy + r * rh, W, fy + r * rh, 0.3); }
    const lbl = String.fromCharCode(65 + (rows - 1 - r)); // A bottom -> up
    text(m / 2, fy + (r + 0.5) * rh, lbl, 3, { anchor: 'middle' });
    text(W - m / 2, fy + (r + 0.5) * rh, lbl, 3, { anchor: 'middle' });
  }

  // ---- title block (bottom-right, inside frame) ----
  const Wb = Math.min(170, fw), Hb = 40;
  const bx = fx + fw - Wb, by = fy + fh - Hb;
  const c1 = 70, c2 = 45;                          // column widths; c3 = rest
  const r1 = 13.33, r2 = 13.33;                    // row heights; r3 = rest
  rect(bx, by, Wb, Hb, 0.6);
  const cell = (x, y, w, h, label, value, o = {}) => {
    line(x, y, x + w, y, 0.3); line(x, y, x, y + h, 0.3); // top + left grid
    if (label) text(x + 1.5, y + 2.8, label, 2.1, { baseline: 'middle' });
    if (value != null && value !== '') text(o.center ? x + w / 2 : x + 2, o.center ? y + h * 0.62 : y + h - 3, value, o.big ? 5 : 3, { anchor: o.center ? 'middle' : 'start', weight: o.big ? 'bold' : 'normal' });
  };
  const f = cfg.fields;
  const c3x = bx + c1 + c2, c3w = Wb - c1 - c2;
  // row 1
  cell(bx, by, c1, r1, 'TITLE', f.title, { big: true });
  cell(bx + c1, by, c2, r1, 'DWG NO.', f.dwgNo);
  cell(c3x, by, c3w / 2, r1, 'SIZE', size.key.replace(/[LP]$/, ''), { center: true });
  cell(c3x + c3w / 2, by, c3w / 2, r1, 'REV', f.rev, { center: true });
  // row 2
  cell(bx, by + r1, c1, r2, 'DRAWN', f.name);
  cell(bx + c1, by + r1, c2, r2, 'DATE', f.date);
  cell(c3x, by + r1, c3w / 2, r2, 'SCALE', f.scale, { center: true });
  cell(c3x + c3w / 2, by + r1, c3w / 2, r2, 'SHEET', f.sheet, { center: true });
  // row 3
  const r3 = Hb - r1 - r2;
  cell(bx, by + r1 + r2, c1 + c2, r3, 'ORGANISATION', f.org);
  cell(c3x, by + r1 + r2, c3w, r3, '', 'DO NOT SCALE DRAWING', { center: true });

  return out.join('');
}

// --------------------------------------------------------------- paper view
class PaperView {
  constructor() { this.scale = 3; this.panX = 0; this.panY = 0; } // px/mm, pan in mm
  toScreen(mm) { return { x: (mm.x - this.panX) * this.scale, y: (mm.y - this.panY) * this.scale }; }
  toMm(s) { return { x: s.x / this.scale + this.panX, y: s.y / this.scale + this.panY }; }
  zoomAt(s, f) { const b = this.toMm(s); this.scale = Math.max(0.5, Math.min(40, this.scale * f)); const a = this.toMm(s); this.panX += b.x - a.x; this.panY += b.y - a.y; }
  fit(W, H, vw, vh) {
    this.scale = Math.max(0.5, Math.min(40, Math.min((vw - 60) / W, (vh - 60) / H)));
    this.panX = W / 2 - vw / 2 / this.scale;
    this.panY = H / 2 - vh / 2 / this.scale;
  }
}

// --------------------------------------------------------------- controller
class Blueprint {
  constructor(app) {
    this.app = app;
    this.view = new PaperView();
    this.drag = null;
  }

  get cfg() { return this.app.store.sheet; }

  enter() {
    if (!this.app.store.sheet) this.app.store.sheet = defaultSheet();
    this.app.mode = 'blueprint';
    document.getElementById('palette').style.display = 'none';
    document.getElementById('properties').style.display = 'none';
    const panel = document.getElementById('blueprint-panel');
    panel.style.display = 'block';
    document.getElementById('toolbar').classList.add('bp-on');
    // first time on this document: pick a format
    this.openFormatDialog(true);
    this.buildPanel();
    this.fitDrawing();
  }

  exit() {
    this.app.mode = 'draft';
    document.getElementById('palette').style.display = '';
    document.getElementById('properties').style.display = '';
    document.getElementById('blueprint-panel').style.display = 'none';
    document.getElementById('toolbar').classList.remove('bp-on');
    this.app.render();
  }

  fitView() {
    const r = this.app.svg.getBoundingClientRect();
    const s = sheetByKey(this.cfg.sizeKey);
    this.view.fit(s.w, s.h, r.width, r.height);
  }

  // Center the drawing on the sheet and pick a scale that fits the frame.
  fitDrawing() {
    const ents = this.app.store.entities;
    const s = sheetByKey(this.cfg.sizeKey);
    const m = 10, fw = s.w - 2 * m, fh = s.h - 2 * m;
    const b = unionBounds(ents);
    const bw = Math.max(0.5, b.maxX - b.minX), bh = Math.max(0.5, b.maxY - b.minY);
    const scaleMM = Math.max(1, Math.min(fw * 0.82 / bw, fh * 0.82 / bh));
    this.cfg.layout.scale = scaleMM;
    this.cfg.layout.overrides = {};
    const wc = { x: (b.minX + b.maxX) / 2, y: (b.minY + b.maxY) / 2 };
    const pc = { x: m + fw / 2, y: m + fh / 2 };
    this.cfg.layout.originX = pc.x - wc.x * scaleMM;
    this.cfg.layout.originY = pc.y + wc.y * scaleMM;
    this.fitView();
    this.app.render();
  }

  render() {
    const r = this.app.svg.getBoundingClientRect();
    const w = Math.max(1, r.width), h = Math.max(1, r.height);
    this.app.svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    this.app.svg.style.cursor = this.drag && this.drag.type === 'part' ? 'grabbing' : 'default';
    const out = [`<rect x="0" y="0" width="${w}" height="${h}" fill="#c9ced6"/>`];
    out.push(buildSheetMarkup(this.view, this.cfg, this.app.store.entities));
    // highlight a moved part's hit area lightly (optional) — keep minimal
    this.app.svg.innerHTML = out.join('');
  }

  // ---- interaction ----
  _screen(ev) { const r = this.app.svg.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
  _world(scr) {
    const mm = this.view.toMm(scr);
    const S = this.cfg.layout.scale;
    return { x: (mm.x - this.cfg.layout.originX) / S, y: -(mm.y - this.cfg.layout.originY) / S };
  }

  _pick(scr) {
    const world = this._world(scr);
    const tol = 6 / (this.cfg.layout.scale * this.view.scale);
    const ents = this.app.store.entities;
    for (let i = ents.length - 1; i >= 0; i--) {
      const e = ents[i]; const off = this.cfg.layout.overrides[e.id] || { x: 0, y: 0 };
      const q = { x: world.x - off.x, y: world.y - off.y };
      const hs = DEFS[e.type].handles(e); let d = Infinity;
      for (const hnd of hs) d = Math.min(d, Math.hypot(q.x - hnd.x, q.y - hnd.y));
      for (let j = 0; j + 1 < hs.length; j++) {
        const a = hs[j], b = hs[j + 1]; const abx = b.x - a.x, aby = b.y - a.y;
        const t = Math.max(0, Math.min(1, ((q.x - a.x) * abx + (q.y - a.y) * aby) / (abx * abx + aby * aby || 1)));
        d = Math.min(d, Math.hypot(q.x - (a.x + abx * t), q.y - (a.y + aby * t)));
      }
      if (d <= tol) return e;
      const bb = DEFS[e.type].bounds(e);
      if (q.x >= bb.minX && q.x <= bb.maxX && q.y >= bb.minY && q.y <= bb.maxY) return e;
    }
    return null;
  }

  onPointerDown(ev) {
    const scr = this._screen(ev);
    if (ev.button === 1 || ev.button === 2 || ev.spaceKey) { this.drag = { type: 'pan', last: scr }; this.app.svg.setPointerCapture(ev.pointerId); return; }
    const hit = this._pick(scr);
    if (hit) this.drag = { type: 'part', id: hit.id, last: scr };
    else this.drag = { type: 'origin', last: scr };       // empty drag moves the whole drawing
    this.app.svg.setPointerCapture(ev.pointerId);
  }

  onPointerMove(ev) {
    if (!this.drag) return;
    const scr = this._screen(ev);
    const dxPx = scr.x - this.drag.last.x, dyPx = scr.y - this.drag.last.y;
    if (this.drag.type === 'pan') { this.view.panX -= dxPx / this.view.scale; this.view.panY -= dyPx / this.view.scale; }
    else if (this.drag.type === 'origin') { this.cfg.layout.originX += dxPx / this.view.scale; this.cfg.layout.originY += dyPx / this.view.scale; }
    else if (this.drag.type === 'part') {
      const S = this.cfg.layout.scale * this.view.scale;
      const o = this.cfg.layout.overrides[this.drag.id] || { x: 0, y: 0 };
      o.x += dxPx / S; o.y -= dyPx / S;                    // world units (Y flip)
      this.cfg.layout.overrides[this.drag.id] = o;
    }
    this.drag.last = scr; this.app.render();
  }

  onPointerUp(ev) { this.drag = null; try { this.app.svg.releasePointerCapture(ev.pointerId); } catch (_) {} }
  onWheel(ev) { ev.preventDefault(); this.view.zoomAt(this._screen(ev), ev.deltaY < 0 ? 1.12 : 1 / 1.12); this.app.render(); }

  // ---- side panel ----
  buildPanel() {
    const f = this.cfg.fields;
    const opts = SHEETS.map((s) => `<option value="${s.key}" ${s.key === this.cfg.sizeKey ? 'selected' : ''}>${s.name}</option>`).join('');
    const field = (k, label, val) => `<label class="prop-row"><span>${label}</span><input data-f="${k}" value="${(val || '').replace(/"/g, '&quot;')}"></label>`;
    document.getElementById('blueprint-panel').innerHTML = `
      <div class="prop-head">📐 Blueprint</div>
      <label class="prop-row"><span>Sheet</span><select id="bp-size">${opts}</select></label>
      <div class="bp-row2">
        <button id="bp-fit">Fit drawing</button>
        <button id="bp-reset">Reset layout</button>
      </div>
      <div class="cat">Title block</div>
      ${field('title', 'Title', f.title)}
      ${field('name', 'Drawn by', f.name)}
      ${field('org', 'Organisation', f.org)}
      ${field('date', 'Date', f.date)}
      ${field('dwgNo', 'Dwg no.', f.dwgNo)}
      ${field('scale', 'Scale', f.scale)}
      ${field('rev', 'Revision', f.rev)}
      ${field('sheet', 'Sheet', f.sheet)}
      <div class="cat">Export</div>
      <div class="bp-row2"><button id="bp-print">🖨 Print / PDF</button><button id="bp-svg">SVG</button><button id="bp-png">PNG</button></div>
      <button id="bp-exit" class="bp-exit">‹ Back to draft</button>
      <p class="prop-empty"><span>Drag a part to separate it; drag empty paper to move the whole drawing. Middle-drag or Space-drag to pan, wheel to zoom.</span></p>`;
    const panel = document.getElementById('blueprint-panel');
    panel.querySelectorAll('input[data-f]').forEach((inp) => inp.addEventListener('input', () => { this.cfg.fields[inp.dataset.f] = inp.value; this.app.render(); }));
    panel.querySelector('#bp-size').addEventListener('change', (e) => { this.cfg.sizeKey = e.target.value; this.fitDrawing(); });
    panel.querySelector('#bp-fit').addEventListener('click', () => this.fitDrawing());
    panel.querySelector('#bp-reset').addEventListener('click', () => { this.cfg.layout.overrides = {}; this.fitDrawing(); });
    panel.querySelector('#bp-exit').addEventListener('click', () => this.exit());
    panel.querySelector('#bp-print').addEventListener('click', () => this.print());
    panel.querySelector('#bp-svg').addEventListener('click', () => this.exportSVG());
    panel.querySelector('#bp-png').addEventListener('click', () => this.exportPNG());
  }

  // ---- format dialog ----
  openFormatDialog(firstTime) {
    const existing = document.getElementById('bp-format'); if (existing) existing.remove();
    const m = document.createElement('div'); m.id = 'bp-format'; m.className = 'modal-backdrop';
    const list = SHEETS.map((s) => `<div class="fmt-item${s.key === this.cfg.sizeKey ? ' sel' : ''}" data-key="${s.key}">${s.name}</div>`).join('');
    const s = sheetByKey(this.cfg.sizeKey);
    m.innerHTML = `<div class="modal fmt">
      <h2>Sheet Format / Size</h2>
      <div class="fmt-body"><div class="fmt-list">${list}</div>
      <div class="fmt-side"><div class="fmt-preview" id="fmt-prev"></div>
      <div id="fmt-dims">Width: ${s.w} mm<br>Height: ${s.h} mm</div></div></div>
      <div class="modal-actions"><button id="fmt-ok">OK</button>${firstTime ? '' : '<button id="fmt-cancel">Cancel</button>'}</div></div>`;
    document.body.appendChild(m);
    let pick = this.cfg.sizeKey;
    const prev = m.querySelector('#fmt-prev');
    const drawPrev = (k) => { const d = sheetByKey(k); const r = d.w / d.h; const pw = r >= 1 ? 150 : 150 * r, ph = r >= 1 ? 150 / r : 150; prev.innerHTML = `<svg width="160" height="160"><rect x="${(160 - pw) / 2}" y="${(160 - ph) / 2}" width="${pw}" height="${ph}" fill="#fff" stroke="#444"/><rect x="${(160 - pw) / 2 + 6}" y="${(160 - ph) / 2 + 6}" width="${pw - 12}" height="${ph - 12}" fill="none" stroke="#aaa"/></svg>`; m.querySelector('#fmt-dims').innerHTML = `Width: ${d.w} mm<br>Height: ${d.h} mm`; };
    drawPrev(pick);
    m.querySelectorAll('.fmt-item').forEach((it) => it.addEventListener('click', () => { m.querySelectorAll('.fmt-item').forEach((x) => x.classList.remove('sel')); it.classList.add('sel'); pick = it.dataset.key; drawPrev(pick); }));
    m.querySelector('#fmt-ok').addEventListener('click', () => { this.cfg.sizeKey = pick; m.remove(); this.buildPanel(); this.fitDrawing(); });
    const cancel = m.querySelector('#fmt-cancel'); if (cancel) cancel.addEventListener('click', () => m.remove());
  }

  // ---- export ----
  _exportSVGString() {
    const ev = new PaperView(); ev.scale = PX_PER_MM; ev.panX = 0; ev.panY = 0;
    const s = sheetByKey(this.cfg.sizeKey);
    const wpx = s.w * PX_PER_MM, hpx = s.h * PX_PER_MM;
    const body = buildSheetMarkup(ev, this.cfg, this.app.store.entities, 'expClip');
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${s.w}mm" height="${s.h}mm" viewBox="0 0 ${wpx.toFixed(1)} ${hpx.toFixed(1)}">${body}</svg>`;
  }
  _download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
  exportSVG() { this._download((this.cfg.fields.title || 'blueprint') + '.svg', new Blob([this._exportSVGString()], { type: 'image/svg+xml' })); }
  exportPNG() {
    const s = sheetByKey(this.cfg.sizeKey); const scale = 2;
    const svg = this._exportSVGString();
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas'); cv.width = s.w * PX_PER_MM * scale; cv.height = s.h * PX_PER_MM * scale;
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.scale(scale, scale); ctx.drawImage(img, 0, 0);
      cv.toBlob((b) => this._download((this.cfg.fields.title || 'blueprint') + '.png', b));
    };
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  }
  print() {
    const w = window.open('', '_blank');
    if (!w) { alert('Allow pop-ups to print.'); return; }
    w.document.write(`<!DOCTYPE html><html><head><title>${this.cfg.fields.title || 'Blueprint'}</title><style>@page{size:auto;margin:0}body{margin:0}svg{display:block}</style></head><body>${this._exportSVGString()}<script>window.onload=function(){window.print();}<\/script></body></html>`);
    w.document.close();
  }
}


// ===== panels.js =====
// Left palette (spawnable prefabs with live thumbnails) and the right-hand
// Properties panel (edit the selected entity's dimensions / parameters).

// Render a prefab into a small standalone SVG thumbnail.
function thumbnail(type, w = 46, h = 36) {
  const e = createEntity(type, { x: 0, y: 0 });
  // give two-point prefabs a sensible spread for the icon
  if ('x2' in e) { e.x2 = 1.4; e.y2 = type === 'distributed' ? 0 : 0; }
  const cam = new Camera();
  const b = DEFS[type].bounds(e);
  cam.fit(b, w, h, 8);
  const pen = new Pen(cam);
  DEFS[type].draw(e, pen, { selected: false, scale: cam.scale });
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${pen.out()}</svg>`;
}

class Palette {
  constructor(el, app) { this.el = el; this.app = app; this.build(); }
  build() {
    const parts = ['<button class="tool-btn sel-tool active" data-tool="select">▣ Select / Move</button>'];
    for (const g of prefabGroups()) {
      parts.push(`<div class="cat">${g.category}</div><div class="grid">`);
      for (const it of g.items) {
        parts.push(`<button class="prefab" data-type="${it.type}" title="${it.name}"><span class="thumb">${thumbnail(it.type)}</span><span class="pname">${it.name}</span></button>`);
      }
      parts.push('</div>');
    }
    this.el.innerHTML = parts.join('');
    this.el.addEventListener('click', (ev) => {
      const sel = ev.target.closest('.sel-tool');
      if (sel) { this.app.tools.setTool('select'); this.setActive('select'); return; }
      const btn = ev.target.closest('.prefab');
      if (btn) { this.app.tools.setTool('place', btn.dataset.type); this.setActive(btn.dataset.type); }
    });
  }
  setActive(key) {
    for (const b of this.el.querySelectorAll('.tool-btn, .prefab')) b.classList.remove('active');
    const target = key === 'select' ? this.el.querySelector('.sel-tool') : this.el.querySelector(`.prefab[data-type="${key}"]`);
    if (target) target.classList.add('active');
  }
}

class Properties {
  constructor(el, app) { this.el = el; this.app = app; this.sig = null; }

  refresh() {
    const sel = [...this.app.store.selection].sort();
    const sig = sel.join(',');
    // Avoid clobbering focus while the user is typing in a field.
    if (sig === this.sig && this.el.contains(document.activeElement)) { this.updateComputed(); return; }
    this.sig = sig;
    this.render();
  }

  render() {
    const sel = this.app.store.selected();
    if (sel.length === 0) {
      this.el.innerHTML = `<div class="prop-empty">No selection.<br><span>Pick a prefab on the left to place it, then select it here to edit its dimensions.</span></div>`;
      return;
    }
    if (sel.length > 1) {
      this.el.innerHTML = `<div class="prop-head">${sel.length} objects selected</div>
        <div class="prop-empty"><span>Move them together, or delete. Select a single object to edit its parameters.</span></div>`;
      return;
    }
    const e = sel[0]; const d = DEFS[e.type];
    const rows = [`<div class="prop-head">${d.name}</div>`];
    const computed = d.compute ? d.compute(e) : {};
    for (const p of d.params) {
      const val = p.type === 'readonly' ? (computed[p.key] ?? '') : e[p.key];
      rows.push(`<label class="prop-row"><span>${p.label}</span>${this.field(p, val)}</label>`);
    }
    // position (always editable)
    if ('x' in e) rows.push(`<label class="prop-row"><span>X</span><input type="number" step="0.1" data-k="x" value="${e.x}"></label>`);
    if ('y' in e) rows.push(`<label class="prop-row"><span>Y</span><input type="number" step="0.1" data-k="y" value="${e.y}"></label>`);
    this.el.innerHTML = rows.join('');
    this.bind(e, d);
  }

  field(p, val) {
    if (p.type === 'readonly') return `<output data-c="${p.key}">${val}</output>`;
    if (p.type === 'text') return `<input type="text" data-k="${p.key}" value="${val ?? ''}">`;
    if (p.type === 'color') return `<input type="color" data-k="${p.key}" value="${val || '#000000'}">`;
    if (p.type === 'bool') return `<input type="checkbox" data-k="${p.key}" ${val ? 'checked' : ''}>`;
    if (p.type === 'select') {
      const opts = p.options.map((o) => `<option value="${o.v}" ${String(o.v) === String(val) ? 'selected' : ''}>${o.t}</option>`).join('');
      return `<select data-k="${p.key}">${opts}</select>`;
    }
    const attrs = [`type="number"`, `data-k="${p.key}"`, `value="${val}"`];
    if (p.step != null) attrs.push(`step="${p.step}"`);
    if (p.min != null) attrs.push(`min="${p.min}"`);
    if (p.max != null) attrs.push(`max="${p.max}"`);
    return `<input ${attrs.join(' ')}>`;
  }

  bind(e, d) {
    for (const input of this.el.querySelectorAll('[data-k]')) {
      const k = input.dataset.k;
      const param = d.params.find((p) => p.key === k);
      const apply = (commit) => {
        let v;
        if (input.type === 'checkbox') v = input.checked;
        else if (input.type === 'number') v = parseFloat(input.value);
        else v = input.value;
        if (input.type === 'number' && !isFinite(v)) return;
        // numeric-valued selects (side/dir) -> keep numbers numeric
        if (param && param.type === 'select' && /^-?\d+(\.\d+)?$/.test(input.value)) v = parseFloat(input.value);
        e[k] = v;
        this.updateComputed();
        this.app.render();
        if (commit) this.app.store.commit();
      };
      const ev = (input.type === 'checkbox' || input.tagName === 'SELECT' || input.type === 'color') ? 'change' : 'input';
      input.addEventListener(ev, () => apply(input.tagName === 'SELECT' || input.type === 'checkbox' || input.type === 'color'));
      input.addEventListener('change', () => this.app.store.commit());
    }
  }

  updateComputed() {
    const sel = this.app.store.selected();
    if (sel.length !== 1) return;
    const e = sel[0]; const d = DEFS[e.type];
    if (!d.compute) return;
    const c = d.compute(e);
    for (const out of this.el.querySelectorAll('output[data-c]')) {
      if (c[out.dataset.c] != null) out.textContent = c[out.dataset.c];
    }
  }
}


// ===== main.js =====
// App bootstrap: builds the scene, wires pointer/keyboard/menu events, runs the
// render loop, and handles file Save/Open (Electron IPC, with a browser fallback).

const app = {
  store: new Store(),
  cam: new Camera(),
  svg: document.getElementById('canvas'),
  showGrid: true,
  mode: 'draft',
  overlay: { snap: null, marquee: null, cursor: 'default', ghost: null, mateTarget: null },
  render() { render(); },
};
app.tools = new Tools(app);
app.blueprint = new Blueprint(app);

const palette = new Palette(document.getElementById('palette'), app);
const props = new Properties(document.getElementById('properties'), app);

// ---- rendering --------------------------------------------------------------
function viewSize() {
  const r = app.svg.getBoundingClientRect();
  return { w: Math.max(1, r.width), h: Math.max(1, r.height) };
}

function render() {
  if (app.mode === 'blueprint') { app.blueprint.render(); return; }
  const { w, h } = viewSize();
  app.svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  app.svg.style.cursor = app.tools.tool === 'place' ? 'crosshair' : 'default';
  const out = [renderGrid(app.cam, w, h, app.showGrid)];

  // entities
  for (const e of app.store.byZ()) {
    const pen = new Pen(app.cam);
    try { DEFS[e.type].draw(e, pen, { selected: app.store.selection.has(e.id), scale: app.cam.scale }); } catch (_) {}
    out.push(`<g class="ent">${pen.out()}</g>`);
  }

  // mate highlight: the link a hovered support/slider would snap onto
  if (app.overlay.mateTarget) {
    const o = app.overlay.mateTarget;
    const a = app.cam.toScreen({ x: o.x1, y: o.y1 }), c = app.cam.toScreen({ x: o.x2, y: o.y2 });
    out.push(`<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${c.x.toFixed(1)}" y2="${c.y.toFixed(1)}" stroke="${SEL}" stroke-width="${(o.w || 5) + 5}" stroke-linecap="round" opacity="0.28"/>`);
  }

  // ghost preview of the prefab about to be placed
  if (app.overlay.ghost) {
    const pen = new Pen(app.cam);
    try { DEFS[app.overlay.ghost.type].draw(app.overlay.ghost, pen, { selected: false, scale: app.cam.scale }); } catch (_) {}
    out.push(`<g opacity="0.5" style="pointer-events:none">${pen.out()}</g>`);
  }

  // selection: bounds box + handles
  for (const e of app.store.selected()) {
    const b = DEFS[e.type].bounds(e);
    const a = app.cam.toScreen({ x: b.minX, y: b.maxY });
    const c = app.cam.toScreen({ x: b.maxX, y: b.minY });
    out.push(`<rect x="${Math.min(a.x, c.x).toFixed(1)}" y="${Math.min(a.y, c.y).toFixed(1)}" width="${Math.abs(c.x - a.x).toFixed(1)}" height="${Math.abs(c.y - a.y).toFixed(1)}" fill="none" stroke="${SEL}" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>`);
    for (const hnd of DEFS[e.type].handles(e)) {
      const s = app.cam.toScreen(hnd);
      out.push(`<rect x="${(s.x - 4).toFixed(1)}" y="${(s.y - 4).toFixed(1)}" width="8" height="8" fill="#fff" stroke="${HANDLE}" stroke-width="1.5"/>`);
    }
  }

  // marquee
  if (app.overlay.marquee) {
    const a = app.cam.toScreen(app.overlay.marquee.a), c = app.cam.toScreen(app.overlay.marquee.b);
    out.push(`<rect x="${Math.min(a.x, c.x)}" y="${Math.min(a.y, c.y)}" width="${Math.abs(c.x - a.x)}" height="${Math.abs(c.y - a.y)}" fill="${SEL}22" stroke="${SEL}" stroke-width="1" stroke-dasharray="3 2"/>`);
  }

  // snap marker
  if (app.overlay.snap) {
    const s = app.cam.toScreen(app.overlay.snap);
    out.push(`<g stroke="#ff8c00" stroke-width="1.4" fill="none"><line x1="${s.x - 6}" y1="${s.y}" x2="${s.x + 6}" y2="${s.y}"/><line x1="${s.x}" y1="${s.y - 6}" x2="${s.x}" y2="${s.y + 6}"/><rect x="${s.x - 4}" y="${s.y - 4}" width="8" height="8"/></g>`);
  }

  app.svg.innerHTML = out.join('');
  updateStatus();
}

function updateStatus() {
  document.getElementById('st-zoom').textContent = `Zoom ${Math.round(app.cam.scale)}px/u`;
  document.getElementById('st-snap').textContent = `Snap ${app.tools.snapEnabled ? 'On' : 'Off'}`;
  document.getElementById('st-grid').textContent = `Grid ${app.showGrid ? 'On' : 'Off'}`;
  document.getElementById('st-count').textContent = `${app.store.entities.length} objects`;
}

// Re-render + refresh properties when the document changes.
app.store.subscribe(() => { props.refresh(); render(); updateTitle(); });

function updateTitle() {
  const name = app.store.filePath ? app.store.filePath.split(/[\\/]/).pop() : 'Untitled';
  document.title = `Helmet CAD — ${name}${app.store.dirty ? ' *' : ''}`;
  const el = document.getElementById('st-file'); if (el) el.textContent = name + (app.store.dirty ? ' *' : '');
}

// ---- pointer wiring ---------------------------------------------------------
let spaceDown = false;
app.svg.addEventListener('pointerdown', (e) => { e.spaceKey = spaceDown; (app.mode === 'blueprint' ? app.blueprint : app.tools).onPointerDown(e); });
app.svg.addEventListener('pointermove', (e) => {
  if (app.mode === 'blueprint') { app.blueprint.onPointerMove(e); return; }
  app.tools.onPointerMove(e);
  const r = app.svg.getBoundingClientRect();
  const wpt = app.cam.toWorld({ x: e.clientX - r.left, y: e.clientY - r.top });
  document.getElementById('st-pos').textContent = `x ${wpt.x.toFixed(2)}  y ${wpt.y.toFixed(2)}`;
});
window.addEventListener('pointerup', (e) => (app.mode === 'blueprint' ? app.blueprint : app.tools).onPointerUp(e));
app.svg.addEventListener('wheel', (e) => (app.mode === 'blueprint' ? app.blueprint : app.tools).onWheel(e), { passive: false });
app.svg.addEventListener('contextmenu', (e) => e.preventDefault());
app.svg.addEventListener('pointerleave', () => {
  if (app.tools.drag) return; // keep state mid-gesture
  app.overlay.snap = null; app.overlay.ghost = null; app.overlay.mateTarget = null;
  app.tools.ghost = null; render();
});
window.addEventListener('resize', render);

// ---- actions ----------------------------------------------------------------
function del() { if (app.store.selection.size) app.store.remove([...app.store.selection]); }
function duplicate() {
  const copies = app.store.selected().map((e) => ({ ...JSON.parse(JSON.stringify(e)), id: uid() }));
  if (!copies.length) return;
  for (const c of copies) { if ('x' in c) { c.x += 0.5; c.y -= 0.5; } if ('x1' in c) { c.x1 += 0.5; c.y1 -= 0.5; c.x2 += 0.5; c.y2 -= 0.5; } if ('vx' in c) { c.vx += 0.5; c.vy -= 0.5; } if ('cx' in c) { c.cx += 0.5; c.cy -= 0.5; } app.store.entities.push(c); }
  app.store.selection = new Set(copies.map((c) => c.id));
  app.store.commit();
}
function zoomFit() {
  if (!app.store.entities.length) return;
  let b = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
  for (const e of app.store.entities) { const eb = DEFS[e.type].bounds(e); b.minX = Math.min(b.minX, eb.minX); b.minY = Math.min(b.minY, eb.minY); b.maxX = Math.max(b.maxX, eb.maxX); b.maxY = Math.max(b.maxY, eb.maxY); }
  const { w, h } = viewSize(); app.cam.fit(b, w, h); render();
}

// ---- file I/O ---------------------------------------------------------------
async function saveDoc(saveAs) {
  const data = app.store.serialize();
  if (window.electronAPI) {
    const res = saveAs ? await window.electronAPI.saveAs(data) : await window.electronAPI.save(data, app.store.filePath);
    if (!res.canceled) { app.store.filePath = res.filePath; app.store.dirty = false; updateTitle(); }
  } else {
    const blob = new Blob([data], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = (app.store.filePath || 'drawing') + '.hcad.json'; a.click();
    URL.revokeObjectURL(a.href); app.store.dirty = false; updateTitle();
  }
}
async function openDoc() {
  if (window.electronAPI) {
    const res = await window.electronAPI.open();
    if (!res.canceled) { app.store.loadData(res.data); app.store.filePath = res.filePath; zoomFit(); updateTitle(); }
  } else {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,.hcad.json';
    inp.onchange = () => { const f = inp.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { app.store.loadData(rd.result); app.store.filePath = f.name.replace(/\.(hcad\.)?json$/, ''); zoomFit(); } catch (err) { alert('Could not open file: ' + err.message); } }; rd.readAsText(f); };
    inp.click();
  }
}

// ---- command dispatch (menu + toolbar + keyboard) ---------------------------
function dispatch(cmd) {
  switch (cmd) {
    case 'new': app.store.newDocument(); break;
    case 'open': openDoc(); break;
    case 'save': saveDoc(false); break;
    case 'saveAs': saveDoc(true); break;
    case 'blueprint': app.mode === 'blueprint' ? app.blueprint.exit() : app.blueprint.enter(); break;
    case 'undo': app.store.undo(); break;
    case 'redo': app.store.redo(); break;
    case 'delete': del(); break;
    case 'duplicate': duplicate(); break;
    case 'selectAll': app.store.selectAll(); break;
    case 'zoomIn': app.cam.zoomAt({ x: viewSize().w / 2, y: viewSize().h / 2 }, 1.2); render(); break;
    case 'zoomOut': app.cam.zoomAt({ x: viewSize().w / 2, y: viewSize().h / 2 }, 1 / 1.2); render(); break;
    case 'zoomFit': zoomFit(); break;
    case 'toggleGrid': app.showGrid = !app.showGrid; render(); break;
    case 'toggleSnap': app.tools.snapEnabled = !app.tools.snapEnabled; render(); break;
    case 'selectTool': app.tools.setTool('select'); palette.setActive('select'); break;
  }
}
if (window.electronAPI) window.electronAPI.onMenu(({ cmd }) => dispatch(cmd));

// toolbar buttons
for (const btn of document.querySelectorAll('[data-cmd]')) btn.addEventListener('click', () => dispatch(btn.dataset.cmd));

// ---- keyboard ---------------------------------------------------------------
window.addEventListener('keydown', (e) => {
  if (e.key === ' ') spaceDown = true;
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName);
  const mod = e.ctrlKey || e.metaKey;
  if (typing && !(mod && ['z', 'y', 's', 'o'].includes(e.key.toLowerCase()))) return;
  if (app.mode === 'blueprint') { if (e.key === 'Escape') app.blueprint.exit(); return; }
  if (e.key === 'Escape') { app.tools.onEscape(); palette.setActive('select'); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && !typing) { e.preventDefault(); del(); }
  else if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? app.store.redo() : app.store.undo(); }
  else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); app.store.redo(); }
  else if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveDoc(e.shiftKey); }
  else if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); openDoc(); }
  else if (mod && e.key.toLowerCase() === 'n') { e.preventDefault(); app.store.newDocument(); }
  else if (mod && e.key.toLowerCase() === 'a' && !typing) { e.preventDefault(); app.store.selectAll(); }
  else if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicate(); }
  else if (mod && e.key.toLowerCase() === 'b') { e.preventDefault(); dispatch('blueprint'); }
  else if (mod && (e.key === '0')) { e.preventDefault(); zoomFit(); }
  else if (mod && (e.key === '=' || e.key === '+')) { e.preventDefault(); dispatch('zoomIn'); }
  else if (mod && e.key === '-') { e.preventDefault(); dispatch('zoomOut'); }
  else if (!typing && e.key.toLowerCase() === 'g') { dispatch('toggleGrid'); }
});
window.addEventListener('keyup', (e) => { if (e.key === ' ') spaceDown = false; });

// ---- go ---------------------------------------------------------------------
updateTitle();
render();

})();
</script>
