<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helmet CAD</title>
<style>
:root {
  --bg: #2b2f36;
  --panel: #333942;
  --panel-2: #3b424c;
  --line: #232831;
  --text: #e6e9ee;
  --muted: #9aa3af;
  --accent: #2d7ef7;
  --accent-2: #1b6fe0;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 13px; color: var(--text); background: var(--bg);
  display: flex; flex-direction: column; overflow: hidden;
}

/* ---- toolbar ---- */
#toolbar {
  display: flex; align-items: center; gap: 4px; padding: 6px 10px;
  background: var(--panel); border-bottom: 1px solid var(--line); flex: 0 0 auto;
}
#toolbar .brand { font-weight: 700; letter-spacing: .3px; margin-right: 6px; }
#toolbar button {
  background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 9px; cursor: pointer; font-size: 12px;
}
#toolbar button:hover { background: #454d59; }
#toolbar button.accent { background: var(--accent); border-color: var(--accent-2); }
#toolbar button.accent:hover { background: var(--accent-2); }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 6px; }
.spacer { flex: 1; }

/* ---- workspace ---- */
#workspace { flex: 1; display: flex; min-height: 0; }
.panel-left { width: 220px; }
.panel-right { width: 250px; }
.panel-left, .panel-right {
  background: var(--panel); overflow-y: auto; flex: 0 0 auto;
}
.panel-left { border-right: 1px solid var(--line); padding: 8px; }
.panel-right { border-left: 1px solid var(--line); padding: 10px; }
#stage { flex: 1; min-width: 0; position: relative; background: #e9edf2; }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; background: #ffffff;
  background-image: radial-gradient(#00000008 1px, transparent 0); }

/* ---- palette ---- */
.tool-btn {
  width: 100%; text-align: left; background: var(--panel-2); color: var(--text);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; cursor: pointer; margin-bottom: 8px;
}
.tool-btn.active, .prefab.active { outline: 2px solid var(--accent); border-color: var(--accent); }
.cat { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 10px 2px 6px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.prefab {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px;
  padding: 7px 4px; cursor: pointer; color: var(--text);
}
.prefab:hover { background: #454d59; }
.prefab .thumb { background: #fff; border-radius: 4px; padding: 2px; line-height: 0; }
.prefab .pname { font-size: 10.5px; text-align: center; line-height: 1.15; color: var(--muted); }

/* ---- properties ---- */
.prop-head { font-weight: 700; font-size: 13px; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.prop-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
.prop-row > span { color: var(--muted); flex: 0 0 96px; }
.prop-row input, .prop-row select, .prop-row output {
  flex: 1; min-width: 0; background: var(--panel-2); color: var(--text);
  border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; font-size: 12px;
}
.prop-row input[type=checkbox] { flex: 0 0 auto; width: 16px; height: 16px; }
.prop-row input[type=color] { flex: 0 0 44px; height: 26px; padding: 1px; }
.prop-row output { background: transparent; border: none; color: var(--text); text-align: right; }
.prop-empty { color: var(--muted); line-height: 1.5; }
.prop-empty span { font-size: 12px; }

/* ---- status bar ---- */
#statusbar {
  display: flex; align-items: center; gap: 12px; padding: 4px 12px;
  background: var(--panel); border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); flex: 0 0 auto;
}
#statusbar .sep { height: 14px; }

/* ---- blueprint panel ---- */
#toolbar.bp-on .accent { background: var(--accent-2); outline: 2px solid #fff3; }
#blueprint-panel .bp-row2 { display: flex; gap: 6px; margin-bottom: 8px; }
#blueprint-panel .bp-row2 button { flex: 1; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 6px; cursor: pointer; font-size: 12px; }
#blueprint-panel .bp-row2 button:hover { background: #454d59; }
#blueprint-panel #bp-print { background: var(--accent); border-color: var(--accent-2); }
#blueprint-panel .bp-exit { width: 100%; margin-top: 12px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px; cursor: pointer; }
#blueprint-panel .bp-exit:hover { background: #454d59; }

/* ---- format dialog ---- */
.modal.fmt { max-width: 560px; }
.fmt-body { display: flex; gap: 16px; }
.fmt-list { flex: 1; border: 1px solid var(--line); border-radius: 6px; max-height: 230px; overflow-y: auto; background: var(--panel-2); }
.fmt-item { padding: 7px 10px; cursor: pointer; border-bottom: 1px solid var(--line); }
.fmt-item:hover { background: #454d59; }
.fmt-item.sel { background: var(--accent); color: #fff; }
.fmt-side { width: 180px; text-align: center; }
.fmt-preview { background: #e9edf2; border: 1px solid var(--line); border-radius: 6px; padding: 6px; margin-bottom: 10px; }
#fmt-dims { color: var(--muted); font-size: 12px; line-height: 1.7; text-align: left; }

/* ---- modal ---- */
.modal-backdrop { position: fixed; inset: 0; background: #0008; display: flex; align-items: center; justify-content: center; z-index: 50; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px; max-width: 460px; box-shadow: 0 18px 60px #000a; }
.modal h2 { margin: 0 0 12px; font-size: 18px; }
.modal p { line-height: 1.55; color: var(--text); }
.modal p.muted { color: var(--muted); font-size: 12px; }
.modal .badge { font-size: 11px; background: var(--accent); color: #fff; border-radius: 20px; padding: 2px 9px; vertical-align: middle; margin-left: 6px; }
.modal-actions { text-align: right; margin-top: 16px; }
.modal-actions button { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; }
.modal-actions button:hover { background: var(--accent-2); }

</style>
</head>
<body>

  <div id="toolbar">
    <span class="brand">⛑ Helmet&nbsp;CAD</span>
    <span class="sep"></span>
    <button data-cmd="new" title="New (Ctrl+N)">New</button>
    <button data-cmd="open" title="Open (Ctrl+O)">Open</button>
    <button data-cmd="save" title="Save (Ctrl+S)">Save</button>
    <button data-cmd="saveAs" title="Save As (Ctrl+Shift+S)">Save As</button>
    <span class="sep"></span>
    <button data-cmd="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button data-cmd="redo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
    <button data-cmd="delete" title="Delete (Del)">🗑 Delete</button>
    <button data-cmd="duplicate" title="Duplicate (Ctrl+D)">⧉ Duplicate</button>
    <span class="sep"></span>
    <button data-cmd="zoomFit" title="Zoom to fit (Ctrl+0)">⤢ Fit</button>
    <button data-cmd="toggleGrid" title="Toggle grid (G)">▦ Grid</button>
    <button data-cmd="toggleSnap" title="Toggle snap (Ctrl+Shift+G)">⌖ Snap</button>
    <span class="spacer"></span>
    <button class="accent" data-cmd="blueprint" title="Blueprint (Ctrl+B)">📐 Blueprint</button>
  </div>

  <div id="workspace">
    <aside id="palette" class="panel-left"></aside>
    <main id="stage">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
    </main>
    <aside id="properties" class="panel-right"></aside>
    <aside id="blueprint-panel" class="panel-right" style="display:none"></aside>
  </div>

  <div id="statusbar">
    <span id="st-file">Untitled</span>
    <span class="sep"></span>
    <span id="st-pos">x 0.00  y 0.00</span>
    <span class="spacer"></span>
    <span id="st-count">0 objects</span>
    <span id="st-snap">Snap On</span>
    <span id="st-grid">Grid On</span>
    <span id="st-zoom">Zoom 60px/u</span>
  </div>

  

<script>
"use strict";
(function(){
// ===== geometry.js =====
// 2D vector math and small geometry helpers used across the app.
// World coordinates use mathematical orientation (Y points up).

const V = {
  add: (a, b) => ({ x: a.x + b.x, y: a.y + b.y }),
  sub: (a, b) => ({ x: a.x - b.x, y: a.y - b.y }),
  scale: (a, s) => ({ x: a.x * s, y: a.y * s }),
  len: (a) => Math.hypot(a.x, a.y),
  dist: (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
  norm: (a) => { const l = Math.hypot(a.x, a.y) || 1; return { x: a.x / l, y: a.y / l }; },
  // perpendicular (rotate +90°)
  perp: (a) => ({ x: -a.y, y: a.x }),
  dot: (a, b) => a.x * b.x + a.y * b.y,
  cross: (a, b) => a.x * b.y - a.y * b.x,
  angle: (a) => Math.atan2(a.y, a.x),
  fromAngle: (rad, len = 1) => ({ x: Math.cos(rad) * len, y: Math.sin(rad) * len }),
  rotate: (a, rad, about = { x: 0, y: 0 }) => {
    const c = Math.cos(rad), s = Math.sin(rad);
    const dx = a.x - about.x, dy = a.y - about.y;
    return { x: about.x + dx * c - dy * s, y: about.y + dx * s + dy * c };
  },
  mid: (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }),
  clone: (a) => ({ x: a.x, y: a.y }),
};

const deg = (rad) => rad * 180 / Math.PI;
const rad = (d) => d * Math.PI / 180;

// Normalize an angle (radians) to (-PI, PI].
function normAngle(a) {
  while (a <= -Math.PI) a += 2 * Math.PI;
  while (a > Math.PI) a -= 2 * Math.PI;
  return a;
}

// Distance from point p to segment a-b, plus the closest point on it.
function pointSegment(p, a, b) {
  const ab = V.sub(b, a);
  const t = Math.max(0, Math.min(1, V.dot(V.sub(p, a), ab) / (V.dot(ab, ab) || 1)));
  const proj = V.add(a, V.scale(ab, t));
  return { dist: V.dist(p, proj), point: proj, t };
}

// Intersection of two infinite lines, each given by a point + direction.
function lineIntersect(p1, d1, p2, d2) {
  const denom = V.cross(d1, d2);
  if (Math.abs(denom) < 1e-9) return null; // parallel
  const t = V.cross(V.sub(p2, p1), d2) / denom;
  return V.add(p1, V.scale(d1, t));
}

// Round to a sensible number of decimals for display.
function fmt(n, decimals = 2) {
  if (!isFinite(n)) return '0';
  const r = Math.round(n * 10 ** decimals) / 10 ** decimals;
  return String(r).replace(/\.0+$/, '').replace(/(\.\d*?)0+$/, '$1');
}

let _id = 1;
function uid(prefix = 'e') { return `${prefix}${(_id++).toString(36)}${Date.now().toString(36).slice(-3)}`; }


// ===== camera.js =====
// Viewport transform: maps world coordinates (Y up, meters) to screen pixels.
// screen.x = (world.x - panX) * scale
// screen.y = (-world.y - panY) * scale    (Y flipped so up is up)
class Camera {
  constructor() {
    this.scale = 60;     // pixels per world unit
    this.panX = -2;      // world coords at screen origin (after Y flip for y)
    this.panY = -7;
  }

  toScreen(p) {
    return { x: (p.x - this.panX) * this.scale, y: (-p.y - this.panY) * this.scale };
  }

  toWorld(s) {
    return { x: s.x / this.scale + this.panX, y: -(s.y / this.scale + this.panY) };
  }

  // Zoom keeping the world point under the cursor fixed on screen.
  zoomAt(screenPt, factor) {
    const before = this.toWorld(screenPt);
    this.scale = Math.max(4, Math.min(2000, this.scale * factor));
    const after = this.toWorld(screenPt);
    this.panX += before.x - after.x;
    this.panY += (-before.y) - (-after.y);
  }

  panBy(dxScreen, dyScreen) {
    this.panX -= dxScreen / this.scale;
    this.panY -= dyScreen / this.scale;
  }

  // Fit the given world bounds {minX,minY,maxX,maxY} into the viewport.
  fit(bounds, width, height, pad = 60) {
    if (!bounds || !isFinite(bounds.minX)) return;
    const w = Math.max(0.5, bounds.maxX - bounds.minX);
    const h = Math.max(0.5, bounds.maxY - bounds.minY);
    this.scale = Math.max(4, Math.min(2000, Math.min((width - 2 * pad) / w, (height - 2 * pad) / h)));
    const cx = (bounds.minX + bounds.maxX) / 2;
    const cy = (bounds.minY + bounds.maxY) / 2;
    this.panX = cx - width / 2 / this.scale;
    this.panY = -cy - height / 2 / this.scale;
  }
}


// ===== renderer.js =====
// SVG renderer. Entities draw through a "pen" that takes WORLD coordinates and
// emits SVG markup, converting via the camera. This keeps entity code free of
// pixel/zoom concerns and makes vector export (future Blueprint feature) trivial.

const INK = '#14181f';
const DIM_COLOR = '#202020';   // dimensions in (near) black, like the source docs
const VEC_COLOR = '#c0392b';   // velocity / reaction vectors in red
const SEL = '#2d7ef7';
const HANDLE = '#2d7ef7';

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// Parse "v_A", "F_{RAx}", "w_2" into runs with subscript flags so labels render
// with real subscripts (engineering variable convention).
function parseLabel(s) {
  const runs = []; let i = 0; const str = String(s);
  while (i < str.length) {
    const u = str.indexOf('_', i);
    if (u < 0) { runs.push({ t: str.slice(i), sub: false }); break; }
    if (u > i) runs.push({ t: str.slice(i, u), sub: false });
    if (str[u + 1] === '{') {
      const end = str.indexOf('}', u + 2);
      const stop = end < 0 ? str.length : end;
      runs.push({ t: str.slice(u + 2, stop), sub: true });
      i = end < 0 ? str.length : end + 1;
    } else { runs.push({ t: str.slice(u + 1, u + 2), sub: true }); i = u + 2; }
  }
  return runs.length ? runs : [{ t: str, sub: false }];
}

class Pen {
  constructor(cam) {
    this.cam = cam;
    this.scale = cam.scale;
    this._out = [];
  }
  _p(w) { return this.cam.toScreen(w); }       // world -> screen point
  _xy(w) { const s = this._p(w); return `${s.x.toFixed(2)},${s.y.toFixed(2)}`; }
  out() { return this._out.join(''); }

  _attrs(o = {}) {
    const stroke = o.stroke ?? INK;
    const w = o.w ?? 1.5;
    let a = `stroke="${stroke}" stroke-width="${w}" fill="${o.fill ?? 'none'}"`;
    if (o.cap) a += ` stroke-linecap="${o.cap}"`;
    if (o.join) a += ` stroke-linejoin="${o.join}"`;
    if (o.dash) a += ` stroke-dasharray="${o.dash}"`;
    if (o.opacity != null) a += ` opacity="${o.opacity}"`;
    return a;
  }

  line(a, b, o = {}) {
    const A = this._p(a), B = this._p(b);
    this._out.push(`<line x1="${A.x.toFixed(2)}" y1="${A.y.toFixed(2)}" x2="${B.x.toFixed(2)}" y2="${B.y.toFixed(2)}" ${this._attrs(o)}/>`);
  }

  poly(points, o = {}) {
    const pts = points.map((p) => this._xy(p)).join(' ');
    const tag = o.close ? 'polygon' : 'polyline';
    this._out.push(`<${tag} points="${pts}" ${this._attrs(o)}/>`);
  }

  circle(c, rWorld, o = {}) { this.circlePx(c, rWorld * this.scale, o); }

  circlePx(c, rPx, o = {}) {
    const C = this._p(c);
    this._out.push(`<circle cx="${C.x.toFixed(2)}" cy="${C.y.toFixed(2)}" r="${Math.max(0, rPx).toFixed(2)}" ${this._attrs(o)}/>`);
  }

  // Arc by world center & radius, from a0 to a1 (radians, world/math angles).
  arc(c, rWorld, a0, a1, o = {}) {
    const seg = [];
    const steps = Math.max(8, Math.ceil(Math.abs(a1 - a0) / (Math.PI / 36)));
    for (let i = 0; i <= steps; i++) {
      const a = a0 + (a1 - a0) * (i / steps);
      seg.push(this._xy(V.add(c, V.fromAngle(a, rWorld))));
    }
    this._out.push(`<polyline points="${seg.join(' ')}" ${this._attrs(o)}/>`);
  }

  // Filled arrowhead with tip at world point `tip`, pointing along world angle.
  arrow(tip, dirRad, o = {}) {
    const size = o.sizePx ?? 11;
    const wing = o.wing ?? 0.38;
    const T = this._p(tip);
    // Screen direction: world dir has Y up; screen Y is down, so negate y.
    const dx = Math.cos(dirRad), dy = -Math.sin(dirRad);
    const px = -dy, py = dx;
    const bx = T.x - dx * size, by = T.y - dy * size;
    const p1 = `${(bx + px * size * wing).toFixed(2)},${(by + py * size * wing).toFixed(2)}`;
    const p2 = `${(bx - px * size * wing).toFixed(2)},${(by - py * size * wing).toFixed(2)}`;
    const fill = o.fill ?? o.stroke ?? INK;
    this._out.push(`<polygon points="${T.x.toFixed(2)},${T.y.toFixed(2)} ${p1} ${p2}" fill="${fill}" stroke="${fill}" stroke-width="0.5"/>`);
  }

  text(pos, str, o = {}) {
    const P = this._p(pos);
    const size = o.sizePx ?? 14;
    const anchor = o.anchor ?? 'middle';
    const baseline = o.baseline ?? 'middle';
    const color = o.color ?? INK;
    let transform = '';
    if (o.rotate) transform = ` transform="rotate(${(o.rotate * 180 / Math.PI).toFixed(2)} ${P.x.toFixed(2)} ${P.y.toFixed(2)})"`;
    // Build subscript-aware content; keep the running baseline-shift correct.
    const runs = parseLabel(str);
    const visibleLen = runs.reduce((n, r) => n + r.t.length, 0);
    let shift = 0; const sub = size * 0.22;
    const inner = runs.map((r) => {
      const want = r.sub ? sub : 0; const dy = want - shift; shift = want;
      const fs = r.sub ? (size * 0.72).toFixed(1) : size;
      return `<tspan dy="${dy.toFixed(2)}" font-size="${fs}">${esc(r.t)}</tspan>`;
    }).join('');
    let bg = '';
    if (o.bg) {
      const w = visibleLen * size * 0.6 + 6, h = size + 4;
      let bx = P.x, by = P.y - h / 2;
      if (anchor === 'middle') bx -= w / 2; else if (anchor === 'end') bx -= w;
      bg = `<rect x="${bx.toFixed(2)}" y="${by.toFixed(2)}" width="${w.toFixed(2)}" height="${h.toFixed(2)}" fill="${o.bg}" ${transform}/>`;
    }
    this._out.push(
      `${bg}<text x="${P.x.toFixed(2)}" y="${P.y.toFixed(2)}" font-family="${o.font ?? 'Cambria, Georgia, serif'}" font-size="${size}" font-style="${o.italic ? 'italic' : 'normal'}" font-weight="${o.weight ?? 'normal'}" fill="${color}" text-anchor="${anchor}" dominant-baseline="${baseline}"${transform}>${inner}</text>`
    );
  }

  // Ground hatching: short 45° ticks along baseline a->b, on the given side (±1).
  hatch(a, b, o = {}) {
    const spacing = (o.spacingPx ?? 9) / this.scale;
    const len = (o.lenPx ?? 9) / this.scale;
    const dir = V.norm(V.sub(b, a));
    const total = V.dist(a, b);
    const side = (o.side ?? 1);
    // hatch direction: 45° from baseline, toward `side`
    const n = V.scale(V.perp(dir), side);
    const hd = V.norm(V.add(V.scale(dir, -1), n)); // points back-and-out (45°)
    this.line(a, b, { stroke: o.stroke ?? INK, w: o.w ?? 1.4 });
    let d = spacing * 0.5;
    while (d < total) {
      const base = V.add(a, V.scale(dir, d));
      this.line(base, V.add(base, V.scale(hd, len)), { stroke: o.stroke ?? INK, w: o.w ?? 1 });
      d += spacing;
    }
  }
}

// Builds the static grid + axes background as an SVG string.
function renderGrid(cam, width, height, show) {
  if (!show) return '';
  const out = [];
  const tl = cam.toWorld({ x: 0, y: 0 });
  const br = cam.toWorld({ x: width, y: height });
  let step = 1;
  // choose grid step so lines are ~>=14px apart
  while (step * cam.scale < 14) step *= 5;
  while (step * cam.scale > 90) step /= 5;
  const x0 = Math.floor(Math.min(tl.x, br.x) / step) * step;
  const x1 = Math.ceil(Math.max(tl.x, br.x) / step) * step;
  const y0 = Math.floor(Math.min(tl.y, br.y) / step) * step;
  const y1 = Math.ceil(Math.max(tl.y, br.y) / step) * step;
  for (let x = x0; x <= x1; x += step) {
    const major = Math.abs(x % (step * 5)) < 1e-6;
    const a = cam.toScreen({ x, y: y0 }), b = cam.toScreen({ x, y: y1 });
    out.push(`<line x1="${a.x.toFixed(1)}" y1="0" x2="${a.x.toFixed(1)}" y2="${height}" stroke="${major ? '#dfe4ea' : '#eef1f5'}" stroke-width="1"/>`);
  }
  for (let y = y0; y <= y1; y += step) {
    const major = Math.abs(y % (step * 5)) < 1e-6;
    const a = cam.toScreen({ x: x0, y });
    out.push(`<line x1="0" y1="${a.y.toFixed(1)}" x2="${width}" y2="${a.y.toFixed(1)}" stroke="${major ? '#dfe4ea' : '#eef1f5'}" stroke-width="1"/>`);
  }
  // world origin
  const o = cam.toScreen({ x: 0, y: 0 });
  out.push(`<line x1="${o.x}" y1="0" x2="${o.x}" y2="${height}" stroke="#c7cfda" stroke-width="1.2"/>`);
  out.push(`<line x1="0" y1="${o.y}" x2="${width}" y2="${o.y}" stroke="#c7cfda" stroke-width="1.2"/>`);
  return out.join('');
}


// ===== entities.js =====
// Parametric entity definitions. Each entity is a plain data object {type, ...params};
// its behaviour (defaults, editable fields, handles, drawing) lives in a DEFS entry.
// All params are world-space; angles are stored in DEGREES for friendlier editing.

// ---- small helpers ----------------------------------------------------------
const P = (e, kx, ky) => ({ x: e[kx], y: e[ky] });
const setP = (e, kx, ky, p) => { e[kx] = p.x; e[ky] = p.y; };

function boundsOf(points, pad = 0) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of points) { minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); }
  return { minX: minX - pad, minY: minY - pad, maxX: maxX + pad, maxY: maxY + pad };
}

// Draw a curved arrow (used by moment / omega). dir: +1 = CCW, -1 = CW.
function arcArrow(pen, c, r, startDeg, sweepDeg, dir, color, w) {
  const a0 = rad(startDeg);
  const a1 = a0 + rad(sweepDeg) * dir;
  pen.arc(c, r, a0, a1, { stroke: color, w });
  const tip = V.add(c, V.fromAngle(a1, r));
  const tan = a1 + (dir > 0 ? Math.PI / 2 : -Math.PI / 2);
  pen.arrow(tip, tan, { sizePx: 11, fill: color });
}

// Generic factory: fills in handles/anchors/translate/bounds from a `pts` list
// of [xKey,yKey] coordinate pairs unless the spec overrides them.
function def(spec) {
  const pts = spec.pts || [];
  const d = { snap: true, ...spec };
  if (!d.handles) d.handles = (e) => pts.map(([kx, ky], i) => ({ key: `p${i}`, x: e[kx], y: e[ky] }));
  if (!d.applyHandle) d.applyHandle = (e, key, w) => {
    const i = Number(key.slice(1)); if (pts[i]) setP(e, pts[i][0], pts[i][1], w);
  };
  if (!d.anchors) d.anchors = (e) => pts.map(([kx, ky]) => ({ x: e[kx], y: e[ky] }));
  if (!d.translate) d.translate = (e, dd) => pts.forEach(([kx, ky]) => { e[kx] += dd.x; e[ky] += dd.y; });
  if (!d.bounds) d.bounds = (e) => boundsOf(pts.map(([kx, ky]) => ({ x: e[kx], y: e[ky] })), 0.3);
  return d;
}

const DEFS = {
  // ======================= STRUCTURE =======================
  node: def({
    name: 'Pin joint', category: 'Structure', pts: [['x', 'y']],
    defaults: (at) => ({ x: at.x, y: at.y, r: 5, label: '' }),
    params: [
      { key: 'r', label: 'Radius (px)', type: 'number', min: 2, max: 40, step: 1 },
      { key: 'label', label: 'Label', type: 'text' },
    ],
    draw: (e, pen) => {
      pen.circlePx({ x: e.x, y: e.y }, e.r, { stroke: INK, w: 1.8, fill: '#fff' });
      if (e.label) pen.text(V.add(P(e, 'x', 'y'), { x: 0.18, y: 0.18 }), e.label, { sizePx: 15, anchor: 'start', italic: true });
    },
  }),

  link: def({
    name: 'Link / bar', category: 'Structure', pts: [['x1', 'y1'], ['x2', 'y2']],
    defaults: (at) => ({ x1: at.x, y1: at.y, x2: at.x + 2, y2: at.y, w: 5, label: '' }),
    params: [
      { key: 'w', label: 'Thickness (px)', type: 'number', min: 1, max: 24, step: 1 },
      { key: 'label', label: 'Label', type: 'text' },
      { key: 'length', label: 'Length', type: 'readonly' },
      { key: 'angle', label: 'Angle°', type: 'readonly' },
    ],
    compute: (e) => ({
      length: fmt(V.dist(P(e, 'x1', 'y1'), P(e, 'x2', 'y2')), 3),
      angle: fmt(deg(V.angle(V.sub(P(e, 'x2', 'y2'), P(e, 'x1', 'y1')))), 1),
    }),
    anchors: (e) => [P(e, 'x1', 'y1'), P(e, 'x2', 'y2'), V.mid(P(e, 'x1', 'y1'), P(e, 'x2', 'y2'))],
    draw: (e, pen) => {
      const a = P(e, 'x1', 'y1'), b = P(e, 'x2', 'y2');
      pen.line(a, b, { stroke: INK, w: e.w, cap: 'round' });
      if (e.label) pen.text(V.add(V.mid(a, b), { x: 0, y: 0.25 }), e.label, { sizePx: 15, italic: true });
    },
  }),

  // ======================= SUPPORTS =======================
  fixedWall: def({
    name: 'Fixed wall (ground)', category: 'Supports', pts: [['x1', 'y1'], ['x2', 'y2']],
    defaults: (at) => ({ x1: at.x - 1, y1: at.y, x2: at.x + 1, y2: at.y, side: 1 }),
    params: [{ key: 'side', label: 'Hatch side', type: 'select', options: [{ v: 1, t: 'Left/Up' }, { v: -1, t: 'Right/Down' }] }],
    draw: (e, pen) => pen.hatch(P(e, 'x1', 'y1'), P(e, 'x2', 'y2'), { side: Number(e.side), w: 1.6 }),
  }),

  pinSupport: def({
    name: 'Pin support (hinge)', category: 'Supports', pts: [['x', 'y']],
    defaults: (at) => ({ x: at.x, y: at.y, angle: 270, size: 0.7 }),
    params: [
      { key: 'angle', label: 'Direction°', type: 'number', step: 5 },
      { key: 'size', label: 'Size', type: 'number', min: 0.1, step: 0.1 },
    ],
    bounds: (e) => boundsOf([P(e, 'x', 'y')], e.size * 1.4),
    draw: (e, pen) => drawTriSupport(e, pen, false),
  }),

  rollerSupport: def({
    name: 'Roller support', category: 'Supports', pts: [['x', 'y']],
    defaults: (at) => ({ x: at.x, y: at.y, angle: 270, size: 0.7 }),
    params: [
      { key: 'angle', label: 'Direction°', type: 'number', step: 5 },
      { key: 'size', label: 'Size', type: 'number', min: 0.1, step: 0.1 },
    ],
    bounds: (e) => boundsOf([P(e, 'x', 'y')], e.size * 1.7),
    draw: (e, pen) => drawTriSupport(e, pen, true),
  }),

  sliderSlot: def({
    name: 'Slider in slot', category: 'Supports', pts: [['x', 'y']],
    defaults: (at) => ({ x: at.x, y: at.y, angle: 0, blockW: 0.9, blockH: 0.5, side: 1, guideLen: 2.4, hatch: true }),
    params: [
      { key: 'angle', label: 'Surface°', type: 'number', step: 5 },
      { key: 'blockW', label: 'Block width', type: 'number', min: 0.1, step: 0.1 },
      { key: 'blockH', label: 'Block height', type: 'number', min: 0.1, step: 0.1 },
      { key: 'guideLen', label: 'Guide length', type: 'number', min: 0.2, step: 0.2 },
      { key: 'side', label: 'Hatch side', type: 'select', options: [{ v: 1, t: 'Above' }, { v: -1, t: 'Below' }] },
      { key: 'hatch', label: 'Ground hatch', type: 'bool' },
    ],
    bounds: (e) => boundsOf([P(e, 'x', 'y')], Math.max(e.guideLen, e.blockW)),
    draw: (e, pen) => {
      const c = P(e, 'x', 'y');
      const u = V.fromAngle(rad(e.angle)); const n = V.scale(V.perp(u), Number(e.side));
      const surfOff = V.scale(n, e.blockH / 2);
      const sCenter = V.add(c, surfOff);
      const ga = V.add(sCenter, V.scale(u, e.guideLen / 2)), gb = V.add(sCenter, V.scale(u, -e.guideLen / 2));
      if (e.hatch) pen.hatch(gb, ga, { side: Number(e.side), w: 1.6 });
      else pen.line(gb, ga, { w: 1.6 });
      // slider block
      const hw = V.scale(u, e.blockW / 2), hh = V.scale(n, e.blockH / 2);
      pen.poly([V.add(V.add(c, hw), hh), V.add(V.sub(c, hw), hh), V.sub(V.sub(c, hw), hh), V.sub(V.add(c, hw), hh)], { close: true, w: 1.6, fill: '#fff' });
      pen.circlePx(c, 5.5, { stroke: INK, w: 1.6, fill: '#fff' });
    },
  }),

  piston: def({
    name: 'Piston / cylinder', category: 'Structure', pts: [['x', 'y']],
    defaults: (at) => ({ x: at.x, y: at.y, angle: 0, bore: 0.8, cylLen: 1.8, rodLen: 1.2, headT: 0.28, wall: 0.12 }),
    params: [
      { key: 'angle', label: 'Direction°', type: 'number', step: 5 },
      { key: 'bore', label: 'Bore', type: 'number', min: 0.1, step: 0.05 },
      { key: 'cylLen', label: 'Cylinder length', type: 'number', min: 0.2, step: 0.1 },
      { key: 'rodLen', label: 'Rod length', type: 'number', min: 0.1, step: 0.1 },
      { key: 'headT', label: 'Head thickness', type: 'number', min: 0.05, step: 0.02 },
      { key: 'wall', label: 'Wall', type: 'number', min: 0.02, step: 0.02 },
    ],
    bounds: (e) => boundsOf([P(e, 'x', 'y')], e.cylLen + e.rodLen),
    draw: (e, pen) => {
      const pin = P(e, 'x', 'y');
      const u = V.fromAngle(rad(e.angle)); const n = V.perp(u);
      const half = e.bore / 2, outer = half + e.wall;
      const A = V.add(pin, V.scale(u, -e.rodLen));          // front face of head
      const headBack = V.add(A, V.scale(u, -e.headT));
      const cylBack = V.add(A, V.scale(u, -e.cylLen));
      // cylinder: top + bottom rails only (closed back/cap omitted), open at both ends
      pen.line(V.add(A, V.scale(n, outer)), V.add(cylBack, V.scale(n, outer)), { w: 1.8 });
      pen.line(V.add(A, V.scale(n, -outer)), V.add(cylBack, V.scale(n, -outer)), { w: 1.8 });
      // piston head
      pen.poly([
        V.add(A, V.scale(n, half)), V.add(headBack, V.scale(n, half)),
        V.add(headBack, V.scale(n, -half)), V.add(A, V.scale(n, -half)),
      ], { close: true, w: 1.6, fill: '#eef1f5' });
      // rod + pin
      pen.line(V.add(A, V.scale(u, -e.headT / 2)), pin, { w: 4, cap: 'round' });
      pen.circlePx(pin, 5.5, { stroke: INK, w: 1.6, fill: '#fff' });
    },
  }),

  // ======================= LOADS =======================
  force: def({
    name: 'Force (point load)', category: 'Loads', pts: [['x', 'y']],
    defaults: (at) => ({ x: at.x, y: at.y, angle: 90, length: 1.3, label: 'F', color: INK }),
    params: [
      { key: 'angle', label: 'Direction°', type: 'number', step: 5 },
      { key: 'length', label: 'Arrow length', type: 'number', min: 0.2, step: 0.1 },
      { key: 'label', label: 'Label', type: 'text' },
      { key: 'color', label: 'Color', type: 'color' },
    ],
    handles: (e) => [
      { key: 'p0', x: e.x, y: e.y },
      { key: 'tail', x: e.x - Math.cos(rad(e.angle)) * e.length, y: e.y - Math.sin(rad(e.angle)) * e.length },
    ],
    applyHandle: (e, key, w) => {
      if (key === 'p0') { e.x = w.x; e.y = w.y; }
      else { const d = V.sub(P(e, 'x', 'y'), w); e.length = Math.max(0.1, V.len(d)); e.angle = deg(V.angle(d)); }
    },
    bounds: (e) => boundsOf([P(e, 'x', 'y'), { x: e.x - Math.cos(rad(e.angle)) * e.length, y: e.y - Math.sin(rad(e.angle)) * e.length }], 0.3),
    draw: (e, pen) => {
      const tip = P(e, 'x', 'y');
      const tail = V.add(tip, V.fromAngle(rad(e.angle), -e.length));
      pen.line(tail, tip, { stroke: e.color, w: 2.2 });
      pen.arrow(tip, rad(e.angle), { sizePx: 12, fill: e.color });
      if (e.label) pen.text(V.add(tail, V.fromAngle(rad(e.angle), -0.25)), e.label, { sizePx: 16, color: e.color, weight: 'bold', bg: '#ffffffcc' });
    },
  }),

  distributed: def({
    name: 'Distributed load', category: 'Loads', pts: [['x1', 'y1'], ['x2', 'y2']],
    defaults: (at) => ({ x1: at.x, y1: at.y, x2: at.x + 3, y2: at.y, shape: 'uniform', peak: 1.0, side: 1, count: 6, label: 'q', color: INK }),
    params: [
      { key: 'shape', label: 'Shape', type: 'select', options: [{ v: 'uniform', t: 'Uniform' }, { v: 'triangular', t: 'Triangular ▶' }, { v: 'triangular2', t: 'Triangular ◀' }] },
      { key: 'peak', label: 'Height', type: 'number', min: 0.1, step: 0.1 },
      { key: 'count', label: 'Arrows', type: 'number', min: 2, max: 40, step: 1 },
      { key: 'side', label: 'Side', type: 'select', options: [{ v: 1, t: 'Left/Up' }, { v: -1, t: 'Right/Down' }] },
      { key: 'label', label: 'Label', type: 'text' },
      { key: 'color', label: 'Color', type: 'color' },
    ],
    anchors: (e) => [P(e, 'x1', 'y1'), P(e, 'x2', 'y2'), V.mid(P(e, 'x1', 'y1'), P(e, 'x2', 'y2'))],
    bounds: (e) => boundsOf([P(e, 'x1', 'y1'), P(e, 'x2', 'y2')], e.peak + 0.3),
    draw: (e, pen) => {
      const a = P(e, 'x1', 'y1'), b = P(e, 'x2', 'y2');
      const dir = V.sub(b, a); const L = V.len(dir) || 1; const u = V.scale(dir, 1 / L);
      const n = V.scale(V.perp(u), Number(e.side));
      const prof = (t) => e.shape === 'uniform' ? e.peak : e.shape === 'triangular' ? e.peak * t : e.peak * (1 - t);
      const topPts = [];
      const N = Math.max(2, Math.round(e.count));
      for (let i = 0; i <= N; i++) {
        const t = i / N; const base = V.add(a, V.scale(u, L * t)); const h = prof(t);
        const top = V.add(base, V.scale(n, h));
        topPts.push(top);
        if (h > 1e-3) { pen.line(top, base, { stroke: e.color, w: 1.4 }); pen.arrow(base, V.angle(V.scale(n, -1)), { sizePx: 8, fill: e.color }); }
      }
      pen.poly(topPts, { stroke: e.color, w: 1.6 });
      if (e.label) pen.text(V.add(V.mid(a, b), V.scale(n, e.peak + 0.25)), e.label, { sizePx: 15, color: e.color, italic: true, bg: '#ffffffcc' });
    },
  }),

  moment: def({
    name: 'Moment', category: 'Loads', pts: [['x', 'y']],
    defaults: (at) => ({ x: at.x, y: at.y, r: 0.5, dir: 1, start: 60, sweep: 270, label: 'M', color: INK }),
    params: [
      { key: 'r', label: 'Radius', type: 'number', min: 0.1, step: 0.05 },
      { key: 'dir', label: 'Direction', type: 'select', options: [{ v: 1, t: 'CCW ↺' }, { v: -1, t: 'CW ↻' }] },
      { key: 'start', label: 'Start°', type: 'number', step: 5 },
      { key: 'sweep', label: 'Sweep°', type: 'number', min: 10, max: 350, step: 5 },
      { key: 'label', label: 'Label', type: 'text' },
      { key: 'color', label: 'Color', type: 'color' },
    ],
    bounds: (e) => boundsOf([P(e, 'x', 'y')], e.r + 0.3),
    draw: (e, pen) => {
      arcArrow(pen, P(e, 'x', 'y'), e.r, e.start, e.sweep, Number(e.dir), e.color, 2);
      if (e.label) pen.text(V.add(P(e, 'x', 'y'), { x: e.r + 0.25, y: 0 }), e.label, { sizePx: 15, color: e.color, anchor: 'start', italic: true });
    },
